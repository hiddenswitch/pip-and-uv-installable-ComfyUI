# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Backend Tests

#
# This workflow is a test of the python package build.
# Install Python dependencies across different Python versions.
#

on: [ push ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_execute_nvidia:
    environment: "Testing"
    name: ${{ matrix.runner.friendly_name }}
    runs-on: ${{ matrix.runner.labels }}
    container: ${{ matrix.runner.container }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - labels: [self-hosted, linux, X64, cuda-3090-24gb]
            friendly_name: "(LTS) Python 3.12 CUDA 13.1.0 PyTorch 2.10.0"
            container: "nvcr.io/nvidia/pytorch:25.12-py3"
          - labels: [self-hosted, linux, X64, cuda-3090-24gb]
            friendly_name: "Python 3.12 CUDA 12.9.1 PyTorch 2.8.0"
            container: "nvcr.io/nvidia/pytorch:25.06-py3"
          - labels: [self-hosted, linux, X64, cuda-3090-24gb]
            friendly_name: "Python 3.12 CUDA 12.8.1.012 PyTorch 2.7.0"
            container: "nvcr.io/nvidia/pytorch:25.03-py3"
          - labels: [self-hosted, linux, X64, cuda-3090-24gb]
            friendly_name: "Python 3.10 CUDA 12.6.2 PyTorch 2.5.0"
            container: "nvcr.io/nvidia/pytorch:24.10-py3"
          - labels: [self-hosted, linux, X64, cuda-3090-24gb]
            friendly_name: "Python 3.10 CUDA 12.3.2 PyTorch 2.2.0"
            container: "nvcr.io/nvidia/pytorch:23.12-py3"
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends libxcb1
        name: Install system dependencies
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
        name: Install uv
      - uses: actions/checkout@v4
        name: Checkout git repo
      - name: Update numpy
        run: |
          # jax requires >=1.26 and sometimes greater
          # todo: we probably want to remove the dependency on jax since it's basically not compatible with old python
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          
          ( [[ "$(uv pip freeze | awk -F'[=.]' '/^numpy==/ {print $3}')" -lt 2 ]] && echo "numpy<2" || echo "numpy>=2" ) >> numpy_override.txt
          uv pip install -U $(cat numpy_override.txt)
      - name: Update OpenCV
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          export UV_OVERRIDE=numpy_override.txt
          
          uv pip uninstall opencv opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          python -c "from pathlib import Path; import shutil; [shutil.rmtree(path, ignore_errors=True) for base in (Path('/usr/local/lib'), Path('/opt/conda/lib')) if base.exists() for pattern in ('python*/dist-packages/cv2', 'python*/site-packages/cv2') for path in base.glob(pattern)]"
          for attempt in 1 2 3; do
            uv pip install -U --no-deps opencv-python-headless && break
            [ \"$attempt\" -eq 3 ] && exit 1
            sleep 10
          done
      - name: Write Overrides
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true

          touch overrides.txt
          cat <<'EOF' > excludes.txt
          torch
          torchvision
          torchaudio
          EOF
          uv pip freeze | awk '/^(numpy|opencv)/' >> overrides.txt || true
          echo "sentry-sdk; python_version < '0'" >> overrides.txt
      - name: Install ComfyUI
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          export UV_OVERRIDE=overrides.txt
          export UV_EXCLUDE=excludes.txt
          uv pip install --torch-backend=auto ".[dev]" --inexact
      - name: Install VideoHelperSuite
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          export UV_OVERRIDE=overrides.txt
          export UV_EXCLUDE=excludes.txt
          for attempt in 1 2 3; do
            uv pip install "comfyui-videohelpersuite@git+https://github.com/AppMana/appmana-comfyui-nodes-video-helper-suite.git" --inexact && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium
      - name: Environment info
        run: |
          hostname
          python -c "import torch; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available()); print('hip', getattr(torch.version, 'hip', None))"
          nvidia-smi || true
          if command -v rocminfo >/dev/null 2>&1; then rocminfo | head -n 80; fi
          if command -v rocm-smi >/dev/null 2>&1; then rocm-smi; elif [ -x /opt/rocm/bin/rocm-smi ]; then /opt/rocm/bin/rocm-smi; fi
      - name: Lint for errors
        run: |
          pylint comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/
      - name: Run unit tests
        run: |
          pytest -v --tb=long --capture=no tests/unit
#      - name: Run inference tests
#        if: matrix.runner.friendly_name == 'Python 3.12 CUDA 13.1.0 PyTorch 2.10.0'
#        run: |
#          pytest -v tests/inference
  build_and_execute_amd:
    environment: "Testing"
    name: ${{ matrix.runner.friendly_name }}
    runs-on: ${{ matrix.runner.labels }}
    container: ${{ matrix.runner.container }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - labels: [self-hosted, linux, X64, rocm-7600-8gb]
            friendly_name: "Python 3.12 ROCm 7.0 Torch 2.7.1"
            container: "rocm/pytorch:rocm7.0_ubuntu24.04_py3.12_pytorch_release_2.7.1"
    steps:
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
        name: Install uv
      - name: Align ROCm to Image
        run: |
          # our testing infrastructure uses RX 7XXX GPUs, this includes express support for gfx1102, gfx1101 which will resolve crashes
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_PYTHON=/opt/venv/bin/python
          export UV_PRERELEASE=allow
          uv pip install --index-url https://rocm.nightlies.amd.com/v2/gfx110X-dgpu/ "rocm[libraries]<7.9" "torch==2.7.1+rocm7.0.0rc20250922" "torchaudio==2.7.1a0+rocm7.0.0rc20250922" "torchvision==0.22.1+rocm7.0.0rc20250922" "pytorch_triton_rocm" --pre
      - uses: actions/checkout@v4
        name: Checkout git repo
        with:
          path: src
      - run: |
          apt install libsndfile1 libxcb1 -y --no-install-recommends
        name: sndfile Dependency
      - name: Write Overrides
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_PYTHON=/opt/venv/bin/python
          echo ${GITHUB_WORKSPACE}
          touch overrides.txt
          cat <<'EOF' > excludes.txt
          torch
          torchvision
          torchaudio
          EOF
          uv pip freeze | awk '/^(numpy|opencv)/' >> overrides.txt || true
          echo "sentry-sdk; python_version < '0'" >> overrides.txt
      - name: Install ComfyUI
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_PYTHON=/opt/venv/bin/python
          export UV_PRERELEASE=allow
          export UV_OVERRIDE=overrides.txt
          export UV_EXCLUDE=excludes.txt
          uv pip install "comfyui[dev]@${GITHUB_WORKSPACE}/src"
      - name: Install VideoHelperSuite
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_PYTHON=/opt/venv/bin/python
          export UV_PRERELEASE=allow
          export UV_OVERRIDE=overrides.txt
          export UV_EXCLUDE=excludes.txt
          for attempt in 1 2 3; do
            uv pip install "comfyui-videohelpersuite@git+https://github.com/AppMana/appmana-comfyui-nodes-video-helper-suite.git" --inexact && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium
      - name: Lint for errors
        run: |
          cd ${GITHUB_WORKSPACE}/src
          pylint comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/
      - name: Run unit tests
        run: |
          cd ${GITHUB_WORKSPACE}/src
          python -m pytest -v --tb=long --capture=no tests/unit --ignore=tests/unit/test_panics.py
#      - name: Run inference tests
#        run: |
#          cd ${GITHUB_WORKSPACE}/src
#          python -m pytest -v tests/inference
  build_and_execute_intel:
    environment: "Testing"
    name: ${{ matrix.runner.friendly_name }}
    runs-on: ${{ matrix.runner.labels }}
    container: ${{ matrix.runner.container }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - labels: [self-hosted, linux, X64, ipex-a380-6gb]
            friendly_name: "Python IPEX 2.8.10 XPU"
            container: "intel/intel-extension-for-pytorch:2.8.10-xpu"
    steps:
      - run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y software-properties-common curl
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get purge -y python3.11 python3.11-minimal libpython3.11 libpython3.11-minimal libpython3.11-stdlib
          apt-get install -y python3.11 python3.11-venv python3.11-dev libpython3.11
          curl -LsSf https://astral.sh/uv/install.sh | sh
        name: Install uv
      - uses: actions/checkout@v4
        name: Checkout git repo
        with:
          path: src
      - run: |
          apt-get install -y libsndfile1 libxcb1 --no-install-recommends
        name: sndfile Dependency
      - name: Write Overrides
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          echo ${GITHUB_WORKSPACE}
          touch overrides.txt
          cat <<'EOF' > excludes.txt
          torch
          torchvision
          torchaudio
          EOF
          uv pip freeze | awk '/^(numpy|opencv)/' >> overrides.txt || true
          echo "sentry-sdk; python_version < '0'" >> overrides.txt
      - name: Install ComfyUI
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          export UV_PRERELEASE=allow
          export UV_OVERRIDE=overrides.txt
          export UV_EXCLUDE=excludes.txt
          uv pip install "comfyui[dev]@${GITHUB_WORKSPACE}/src"
      - name: Install VideoHelperSuite
        run: |
          export UV_BREAK_SYSTEM_PACKAGES=true
          export UV_SYSTEM_PYTHON=true
          export UV_PRERELEASE=allow
          export UV_OVERRIDE=overrides.txt
          export UV_EXCLUDE=excludes.txt
          for attempt in 1 2 3; do
            uv pip install "comfyui-videohelpersuite@git+https://github.com/AppMana/appmana-comfyui-nodes-video-helper-suite.git" --inexact && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium
      - name: Lint for errors
        run: |
          cd ${GITHUB_WORKSPACE}/src
          pylint comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/
      - name: Run unit tests
        run: |
          cd ${GITHUB_WORKSPACE}/src
          python -m pytest -v --tb=long --capture=no tests/unit --ignore=tests/unit/test_panics.py --ignore=tests/unit/assets_test --ignore=tests/unit/manager_test
#      - name: Run inference tests
#        run: |
#          cd ${GITHUB_WORKSPACE}/src
#          python -m pytest -v tests/inference
  build_and_execute_windows_nvidia:
    environment: "Testing"
    name: "Windows CUDA 12.8 PyTorch 2.10.0"
    runs-on: [self-hosted, windows-cuda-3090-24gb]
    container:
      image: harbor.appmana.com/appmana-shared/buildervscuda:windows-1.0.0-ltsc2022
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - name: Checkout git repo
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize Windows graphics environment
        run: |
          if [ -f C:/enable-graphics-apis.ps1 ]; then
            powershell -ExecutionPolicy Bypass -File C:/enable-graphics-apis.ps1
          else
            cat <<'EOF' > enable-graphics-apis.ps1
            function CopyToSystem32($sourceDirectory, $filenames, $rename)
            {
            	foreach ($filename in $filenames)
            	{
            		$source = "$sourceDirectory\$filename"
            		$destination = "C:\Windows\System32\$filename"
            		if ($rename -and $rename[$filename])
            		{
            			$renamed = $rename[$filename]
            			$destination = "C:\Windows\System32\$renamed"
            		}
            		Write-Host "    Copying $source to $destination"
            		try {
            			Copy-Item -Path "$source" -Destination "$destination" -ErrorAction Stop
            		}
            		catch {
            			Write-Host "    Warning: failed to copy file $filename" -ForegroundColor Yellow
            		}
            	}
            }
            $nvidiaSentinelFile = (Get-ChildItem "C:\Windows\System32\HostDriverStore\FileRepository\nv*.inf_amd64_*\nvapi64.dll" -ErrorAction SilentlyContinue)
            if ($nvidiaSentinelFile) {
            	$nvidiaDirectory = $nvidiaSentinelFile[0].VersionInfo.FileName | Split-Path
            	Write-Host "Found NVIDIA Display Driver directory: $nvidiaDirectory"
            	Write-Host "`nEnabling NVIDIA NVAPI support:"
            	CopyToSystem32 -SourceDirectory $nvidiaDirectory -Filenames @("nvapi64.dll", "nvml.dll")
            	Write-Host "`nEnabling NVIDIA NVENC support:"
            	CopyToSystem32 -SourceDirectory $nvidiaDirectory -Filenames @("nvEncodeAPI64.dll", "nvEncMFTH264x.dll", "nvEncMFThevcx.dll")
            	Write-Host "`nEnabling NVIDIA CUVID/NVDEC support:"
            	CopyToSystem32 -SourceDirectory $nvidiaDirectory -Filenames @("nvcuvid64.dll", "nvDecMFTMjpeg.dll", "nvDecMFTMjpegx.dll") -Rename @{"nvcuvid64.dll" = "nvcuvid.dll"}
            	Write-Host "`nEnabling NVIDIA CUDA support:"
            	CopyToSystem32 -SourceDirectory $nvidiaDirectory -Filenames @("nvcuda64.dll", "nvcuda_loader64.dll", "nvptxJitCompiler64.dll") -Rename @{"nvcuda_loader64.dll" = "nvcuda.dll"}
            	Write-Host ""
            }
            EOF
            powershell -ExecutionPolicy Bypass -File ./enable-graphics-apis.ps1
          fi
      - name: Environment info
        run: |
          echo "=== Shell ===" && sh --help 2>&1 | head -1 || true
          echo "=== Python ===" && python --version
          echo "=== UV ===" && uv --version
          echo "=== Working directory ===" && pwd
          echo "=== GPU ===" && nvidia-smi || echo "nvidia-smi not available"
      - name: Create venv and install PyTorch
        run: |
          uv venv C:/venv --python python3
          uv pip install --python C:/venv/Scripts/python.exe torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
      - name: Write Overrides
        run: |
          cat <<'EOF' > excludes.txt
          torch
          torchvision
          torchaudio
          EOF
          uv pip freeze --python C:/venv/Scripts/python.exe | grep -E 'numpy|opencv' > overrides.txt
          cat overrides.txt
      - name: Install ComfyUI
        run: |
          uv pip install --python C:/venv/Scripts/python.exe --override overrides.txt --excludes excludes.txt ".[dev]" --inexact
      - name: Install VideoHelperSuite
        run: |
          for attempt in 1 2 3; do
            uv pip install --python C:/venv/Scripts/python.exe --override overrides.txt --excludes excludes.txt "comfyui-videohelpersuite@git+https://github.com/AppMana/appmana-comfyui-nodes-video-helper-suite.git" --inexact && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
      - name: Lint for errors
        run: |
          C:/venv/Scripts/pylint.exe comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/
      - name: Run unit tests
        run: |
          C:/venv/Scripts/python.exe -m pytest -v --tb=long --capture=no tests/unit
  build_and_execute_macos:
    environment: "Testing"
    name: macOS Installation Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        name: Checkout git repo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: brew install ffmpeg
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install ComfyUI
        run: |
          uv venv --python 3.12
          uv pip install --torch-backend=auto '.[dev]' --inexact
      - name: Install VideoHelperSuite
        run: |
          for attempt in 1 2 3; do
            uv pip install "comfyui-videohelpersuite@git+https://github.com/AppMana/appmana-comfyui-nodes-video-helper-suite.git" --inexact && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
      - name: Lint for errors
        run: |
          uv run pylint comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/
