# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Python Validation

on:
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    if: github.ref_name == 'develop'
    name: Full suite — Arch Python / PyTorch 2.14 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --shm-size=8g
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python uv zip base-devel libxcb mesa
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .uv-cache
          key: uv-linux-py314-${{ hashFiles('ci/locks/pylock.linux-py314-cpu.toml') }}
          restore-keys: uv-linux-py314-
      - name: Install locked dependencies
        run: |
          uv venv --python /usr/bin/python --no-python-downloads .venv
          ci/install-locked.sh ci/locks/pylock.linux-py314-cpu.toml .venv/bin/python
      - name: Environment info
        run: |
          pacman -Q python
          .venv/bin/python - <<'PY'
          import platform
          import subprocess
          import sys
          assert platform.freedesktop_os_release()['ID'] == 'arch'
          system_version = subprocess.check_output(['/usr/bin/python', '-c', 'import platform; print(platform.python_version())'], text=True).strip()
          assert platform.python_version() == system_version
          assert sys.base_prefix == '/usr'
          print('Arch Python', system_version, 'using', sys.executable)
          PY
          .venv/bin/python -c "import torch; print('torch', torch.__version__); assert torch.__version__.startswith('2.14.0'); assert not torch.cuda.is_available()"
      - name: Lint
        run: |
          .venv/bin/python -m ruff check comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/ comfy_compatibility/ comfy_execution/
          .venv/bin/python -m pylint --disable=W4902 comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/ comfy_compatibility/ comfy_execution/
      - name: Custom-node registration
        run: .venv/bin/python -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: Unit tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
        run: .venv/bin/python -m pytest -v tests/unit --ignore=tests/unit/test_workflow_convert_playwright.py

  package-smoke:
    if: github.ref_name == 'master'
    name: Master package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ci/locks/pylock.linux-py314-core.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and install the package
        run: |
          uv venv --python 3.14
          ci/install-locked.sh ci/locks/pylock.linux-py314-core.toml .venv/bin/python
          uv build --wheel --out-dir dist
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Package smoke
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
        run: |
          .venv/bin/python -c "from comfy.cli_args_types import Configuration; from comfy.client.embedded_comfy_client import Comfy; client = Comfy(configuration=Configuration()); assert client is not None"
          .venv/bin/python -m pytest -q tests/unit/test_comfy_instance.py tests/unit/test_cli_args_types_sync.py tests/issues/test_67_ipython_faulthandler.py
