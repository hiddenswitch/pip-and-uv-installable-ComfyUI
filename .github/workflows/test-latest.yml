# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Latest Python + PyTorch

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Python 3.14 PyTorch latest (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --shm-size=8g
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm git python uv zip base-devel libxcb mesa

      - uses: actions/checkout@v5

      - name: Create venv
        run: |
          uv venv --python 3.14 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ComfyUI
        run: |
          uv pip install --python .venv/bin/python --torch-backend=auto --prerelease allow ".[dev]"
          uv cache clean

      - name: Install custom nodes
        env:
          UV_NO_CACHE: "1"
        run: |
          uv pip install --python .venv/bin/python --constraints tests/opencv_constraints.txt -r tests/custom_nodes_requirements.txt --extra-index-url https://nodes.appmana.com/simple --inexact

      - name: Environment info
        run: |
          .venv/bin/python --version
          .venv/bin/python -c "import torch; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available())"

      - name: Lint
        run: |
          .venv/bin/python -m pylint --disable=W4902 comfy/ comfy_extras/ comfy_api/ comfy_api_nodes/ comfy_compatibility/ comfy_execution/

      - name: Unit tests
        run: |
          .venv/bin/python -m pytest -v tests/unit --ignore=tests/unit/test_workflow_convert_playwright.py
