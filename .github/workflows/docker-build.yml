name: Build, Validate, and Publish CUDA Images

on:
  push:
    branches: [develop, master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hiddenswitch/comfyui

jobs:
  build-candidates:
    if: startsWith(github.ref, 'refs/heads/')
    name: Build ${{ matrix.target.name }} candidate
    runs-on: ubuntu-latest
    environment: Testing
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: CUDA 13.3 / PyTorch 2.13
            id: cuda133
            base: nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
            base_name: nvcr.io/nvidia/pytorch:26.07-py3
            base_digest: sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
            stable_abi_cuda: cu130
    steps:
      - uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NVCR_NGC_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push immutable candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.target.id }}-${{ github.run_id }}-${{ github.run_attempt }}.dev
          build-args: |
            BASE_IMAGE=${{ matrix.target.base }}
            STABLE_ABI_CUDA=${{ matrix.target.stable_abi_cuda }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-cuda
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-cuda
          cache-to: type=inline
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.base.name=${{ matrix.target.base_name }}
            org.opencontainers.image.base.digest=${{ matrix.target.base_digest }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.base.name=${{ matrix.target.base_name }}
            org.opencontainers.image.base.digest=${{ matrix.target.base_digest }}

  validate-candidates:
    needs: build-candidates
    name: Validate ${{ matrix.target.name }} candidate
    runs-on: [self-hosted, linux, X64, cuda-3060-12gb]
    timeout-minutes: 60
    container:
      image: ghcr.io/hiddenswitch/comfyui:${{ github.sha }}-${{ matrix.target.id }}-${{ github.run_id }}-${{ github.run_attempt }}.dev
      options: --shm-size=8g
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - name: CUDA 13.3 / PyTorch 2.13
            id: cuda133
    env:
      COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
    defaults:
      run:
        working-directory: /workspace/src
    steps:
      - name: CUDA and ComfyUI smoke
        run: |
          python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("device", torch.cuda.get_device_name(0))
          assert torch.cuda.is_available()
          result = (torch.ones(16, device="cuda") * 2).sum()
          torch.cuda.synchronize()
          assert result.item() == 32
          PY
          python -m comfy.cmd.main --quick-test-for-ci --cwd /workspace/src
      - name: Unit and CUDA tests
        run: |
          pytest -v --timeout=900 \
            tests/unit \
            --ignore=tests/unit/test_workflow_convert_playwright.py \
            tests/quantization

  promote:
    needs: [build-candidates, validate-candidates]
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    environment: Testing
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Promote validated CUDA image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          source="${image}:${GITHUB_SHA}-cuda133-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dev"
          short_sha="${GITHUB_SHA::7}"
          tags=(--tag "${image}:${short_sha}" --tag "${image}:${short_sha}-cuda")
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            tags+=(--tag "${image}:latest" --tag "${image}:latest-cuda")
          else
            tags+=(--tag "${image}:develop" --tag "${image}:develop-cuda")
          fi
          docker buildx imagetools create "${tags[@]}" "$source"

  retag-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: Testing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Retag the validated commit image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          source="${image}:${GITHUB_SHA::7}-cuda"
          version="${GITHUB_REF_NAME#v}"

          for attempt in {1..120}; do
            docker buildx imagetools inspect "$source" >/dev/null 2>&1 && break
            if [ "$attempt" -eq 120 ]; then
              echo "Validated commit image did not become available: $source" >&2
              exit 1
            fi
            sleep 10
          done

          IFS=. read -r major minor patch _revision <<< "$version"
          tags=(--tag "${image}:${version}" --tag "${image}:${version}-cuda")
          if [ -n "${patch:-}" ]; then
            tags+=(--tag "${image}:${major}.${minor}.${patch}" --tag "${image}:${major}.${minor}.${patch}-cuda")
          fi
          if [ -n "${minor:-}" ]; then
            tags+=(--tag "${image}:${major}.${minor}" --tag "${image}:${major}.${minor}-cuda")
          fi
          docker buildx imagetools create "${tags[@]}" "$source"
