openapi: 3.1.0
info:
  title: comfyui
  version: 0.0.1
servers:
  - description: localhost
    url: http://localhost:8188
paths:
  /:
    get:
      summary: (UI) index.html
      operationId: get_root_ui
      responses:
        200:
          description: the index.html of the website
          content:
            text/html:
              schema:
                type: string
              example: "<!DOCTYPE html>..."
  /embeddings:
    get:
      summary: (UI) Get embeddings
      operationId: get_embeddings_ui
      responses:
        200:
          description: |
            Returns a list of the files located in the embeddings/ directory that can be used as arguments for
            embedding nodes. The file extension is omitted.
          content:
            application/json:
              schema:
                description: |
                  File names without extensions in embeddings/ directory
                type: array
                items:
                  type: string
  /extensions:
    get:
      summary: (UI) Get extensions
      operationId: get_extensions_ui
      responses:
        200:
          description: Returns a list of files located in extensions/**/*.js
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /workflow_templates:
    get:
      summary: (UI) Get custom node workflow templates
      operationId: get_workflow_templates_ui
      responses:
        '200':
          description: Map of custom node package names to example workflow filenames.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplatesMap"
  /i18n:
    get:
      summary: (UI) Get custom node translations
      operationId: get_i18n_ui
      responses:
        '200':
          description: Translation payload merged from custom node locale files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomNodesI18n"
  /models:
    get:
      summary: (UI) List model folders
      operationId: list_models_ui
      responses:
        '200':
          description: List of model folder keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /models/{folder}:
    get:
      summary: (UI) List model filenames in a folder
      operationId: list_models_in_folder_ui
      parameters:
        - in: path
          name: folder
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of model filenames.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '404':
          description: Folder not found.
  /experiment/models:
    get:
      summary: (UI) List model folders with backing paths
      operationId: list_experiment_models_ui
      responses:
        '200':
          description: List of model folder metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelFolderInfo"
  /experiment/models/{folder}:
    get:
      summary: (UI) List detailed model files in a folder
      operationId: list_experiment_models_in_folder_ui
      parameters:
        - in: path
          name: folder
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed model file list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelFileInfo"
        '404':
          description: Folder not found.
  /upload/image:
    post:
      summary: (UI) Upload an image.
      description: |
        Uploads an image to the input/ directory.
        
        Never replaces files. The method will return a renamed file name if it would have overwritten an existing file.
      operationId: upload_image_ui
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              description: The upload data
              properties:
                image:
                  description: The image binary data
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImageResponse"
        '400':
          description: |
            The request was missing an image upload.
  /upload/mask:
    post:
      summary: (UI) Upload a mask
      description: |
        Uploads or updates a mask image derived from an existing output image.
      operationId: upload_mask_ui
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                original_ref:
                  type: string
                  description: JSON-encoded original image reference.
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImageResponse"
        '400':
          description: Invalid upload payload.
  /view:
    get:
      summary: (UI) View image
      operationId: view_image_ui
      description: |
        Reads the image with the specified file name and located in the specified subfolder.
      parameters:
        - in: query
          name: filename
          schema:
            type: string
          required: true
        - in: query
          name: type
          schema:
            type: string
            enum:
              - output
              - input
              - temp
        - in: query
          name: subfolder
          schema:
            type: string
        - in: query
          name: channel
          schema:
            type: string
            enum:
              - 'rgba'
              - 'rgb'
              - 'a'
        - in: query
          name: preview
          schema:
            type: string
            pattern: '^(?<format>webp|jpeg);(?<quality>\d{1,2})$'
      responses:
        '200':
          description: Successful retrieval of file
          headers:
            Content-Disposition:
              schema:
                type: string
                pattern: '^filename=".+"'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /view_metadata/{folder_name}:
    get:
      summary: (UI) View model metadata
      operationId: view_metadata_ui
      parameters:
        - in: path
          name: folder_name
          required: true
          schema:
            type: string
        - in: query
          name: filename
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Safetensors metadata payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbitraryObject"
        '404':
          description: Metadata not found.
  /system_stats:
    get:
      summary: (UI) Get system stats
      operationId: get_system_stats_ui
      responses:
        '200':
          description: Runtime system and device information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"
  /features:
    get:
      summary: (UI) Get feature flags
      operationId: get_features_ui
      responses:
        '200':
          description: Server feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbitraryObject"
  /logs:
    get:
      summary: (Internal UI) Get formatted server logs
      description: |
        Frontend-internal endpoint used by the log viewer. Not a stable public API.
      operationId: get_logs_internal_ui
      responses:
        '200':
          description: Concatenated log text.
          content:
            application/json:
              schema:
                type: string
  /logs/raw:
    get:
      summary: (Internal UI) Get raw server logs
      description: |
        Frontend-internal endpoint used by the log viewer. Not a stable public API.
      operationId: get_raw_logs_internal_ui
      responses:
        '200':
          description: Raw terminal log entries and terminal size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsRawResponse"
  /logs/subscribe:
    patch:
      summary: (Internal UI) Subscribe to server logs
      description: |
        Frontend-internal endpoint used by the live log viewer. Not a stable public API.
      operationId: subscribe_logs_internal_ui
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [clientId, enabled]
              properties:
                clientId:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Subscription updated.
  /folder_paths:
    get:
      summary: (Internal UI) Get folder paths
      description: |
        Frontend-internal endpoint exposing configured search roots by model folder key.
        Not a stable public API.
      operationId: get_folder_paths_internal_ui
      responses:
        '200':
          description: Folder keys mapped to search roots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderPaths"
  /prompt:
    get:
      summary: (UI) Get queue info
      operationId: get_prompt_ui
      responses:
        200:
          description: The current queue information
          content:
            application/json:
              schema:
                type: object
                properties:
                  exec_info:
                    type: object
                    properties:
                      queue_remaining:
                        type: integer
    post:
      summary: (UI) Post prompt
      operationId: post_prompt_ui
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        '200':
          description: The prompt was queued and a prompt ID was returned.
          content:
            application/json:
              example:
                prompt_id: "some-value"
              schema:
                type: object
                properties:
                  prompt_id:
                    description: The ID of the prompt that was queued
                    type: string
            text/plain:
              example: "some-value"
              schema:
                type: string
        '400':
          description: The prompt was invalid. The validation error is returned as the content.
          content:
            text/plain:
              schema:
                type: string
  /object_info:
    get:
      summary: (UI) Get object info
      operationId: get_object_info_ui
      responses:
        '200':
          description: The list of supported nodes
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/Node"
  /history:
    get:
      summary: (UI) Get history
      operationId: get_history_ui
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    prompt:
                      $ref: "#/components/schemas/QueueTuple"
                    outputs:
                      $ref: "#/components/schemas/Outputs"
                    status:
                      type: object
                      properties:
                        status_str:
                          type: string
                        completed:
                          type: boolean
                        messages:
                          type: array
                          items:
                            type: string
    post:
      summary: (UI) Post history
      operationId: post_history_ui
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clear:
                  type: boolean
                delete:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: OK
  /queue:
    get:
      summary: (UI) Get queue
      operationId: get_queue_ui
      responses:
        "200":
          description: the queue state
          content:
            application/json:
              schema:
                type: object
                properties:
                  queue_running:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueTuple"
                  queue_pending:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueTuple"
    post:
      summary: (UI) Post queue
      operationId: post_queue_ui
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clear:
                  type: boolean
                delete:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: OK
  /interrupt:
    post:
      summary: (UI) Post interrupt
      operationId: post_interrupt_ui
      responses:
        '200':
          description: OK
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt_id:
                  type: string
                  description: |
                    The prompt to interrupt.
  /free:
    # from 6d281b4ff4ad3918a4f3b4ca4a8b547a2ba3bf80
    post:
      summary: (UI) Unload models or free memory
      operationId: free_ui
      responses:
        200:
          description: The free request was accepted. No content body.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    unload_models:
                      type: boolean
                      enum: [ true ]
                  required:
                    - unload_models
                  additionalProperties: false
                - type: object
                  properties:
                    free_memory:
                      type: boolean
                      enum: [ true ]
                  required:
                    - free_memory
                  additionalProperties: false
              description: >-
                A POST request to /free with: {"unload_models":true} will unload models from vram. 
                A POST request to /free with: {"free_memory":true} will unload models and free all cached data from the last run workflow.
  /users:
    get:
      summary: (UI) Get user configuration
      operationId: get_users_ui
      responses:
        '200':
          description: User mode and storage configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConfig"
    post:
      summary: (UI) Create user
      operationId: post_users_ui
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Created user ID.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid or duplicate username.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /settings:
    get:
      summary: (UI) Get settings
      operationId: get_settings_ui
      responses:
        '200':
          description: User settings dictionary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        '401':
          description: Unauthorized.
    post:
      summary: (UI) Store settings
      operationId: post_settings_ui
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        '200':
          description: Settings updated.
  /settings/{id}:
    get:
      summary: (UI) Get setting
      operationId: get_setting_ui
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Setting value.
          content:
            application/json:
              schema: {}
    post:
      summary: (UI) Store setting
      operationId: post_setting_ui
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Setting updated.
        '400':
          description: Missing setting ID.
  /userdata:
    get:
      summary: (UI) List user data
      operationId: list_userdata_ui
      parameters:
        - in: query
          name: dir
          schema:
            type: string
        - in: query
          name: recurse
          schema:
            type: boolean
        - in: query
          name: full_info
          schema:
            type: boolean
        - in: query
          name: split
          schema:
            type: boolean
      responses:
        '200':
          description: User data entries.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: string
                  - type: array
                    items:
                      type: array
                      items:
                        type: string
                  - type: array
                    items:
                      $ref: "#/components/schemas/UserDataFileInfo"
        '400':
          description: Invalid directory parameter.
        '403':
          description: Invalid directory.
        '404':
          description: Directory not found.
  /userdata/{file}:
    get:
      summary: (UI) Get user data file
      operationId: get_userdata_ui
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid file parameter.
        '403':
          description: Invalid path.
        '404':
          description: File not found.
    post:
      summary: (UI) Store user data file
      operationId: post_userdata_ui
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
        - in: query
          name: overwrite
          schema:
            type: boolean
        - in: query
          name: full_info
          schema:
            type: boolean
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored file path or metadata.
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                  - $ref: "#/components/schemas/UserDataFileInfo"
        '403':
          description: Invalid path.
        '409':
          description: File exists and overwrite is false.
    delete:
      summary: (UI) Delete user data file
      operationId: delete_userdata_ui
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
  /userdata/{file}/move/{dest}:
    post:
      summary: (UI) Move user data file
      operationId: move_userdata_ui
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
        - in: path
          name: dest
          required: true
          schema:
            type: string
        - in: query
          name: overwrite
          schema:
            type: boolean
        - in: query
          name: full_info
          schema:
            type: boolean
      responses:
        '200':
          description: Moved file path or metadata.
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                  - $ref: "#/components/schemas/UserDataFileInfo"
        '404':
          description: Source file not found.
        '409':
          description: Destination exists and overwrite is false.
  /global_subgraphs:
    get:
      summary: (UI) List global subgraphs
      operationId: list_global_subgraphs_ui
      responses:
        '200':
          description: Available global subgraphs keyed by ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/GlobalSubgraphSummary"
  /global_subgraphs/{id}:
    get:
      summary: (UI) Get global subgraph
      operationId: get_global_subgraph_ui
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Global subgraph detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSubgraphDetail"
  /api/jobs:
    get:
      operationId: list_jobs
      summary: (API) List jobs
      description: |
        Lists jobs across the queue and history, with filtering, sorting, and pagination.

        The response shape matches the frontend jobs API types used by the queue panel.
      parameters:
        - in: query
          name: status
          description: Comma-separated job statuses to include.
          schema:
            type: string
            example: completed,failed,cancelled
        - in: query
          name: workflow_id
          description: Filter jobs by workflow ID extracted from `extra_pnginfo.workflow.id`.
          schema:
            type: string
        - in: query
          name: sort_by
          description: Sort field.
          schema:
            type: string
            enum: [created_at, execution_duration]
            default: created_at
        - in: query
          name: sort_order
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: limit
          description: Maximum jobs to return.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          description: Number of jobs to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Jobs list response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListResponse"
        '400':
          description: Invalid filter or pagination parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/jobs/{job_id}:
    get:
      operationId: get_job_detail
      summary: (API) Get job detail
      description: |
        Returns a single job, including workflow and outputs when available.
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
          description: Job ID / prompt ID.
      responses:
        '200':
          description: Job detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        '400':
          description: Missing or invalid job ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/reboot:
    post:
      operationId: reboot
      summary: (API) Reboot server
      description: |
        Restart the ComfyUI server process. The server shuts down gracefully
        (stopping prompt workers and closing connections), then replaces the
        current process via `os.execv` with the same command-line arguments.

        The response is sent before the shutdown begins. Clients should
        poll the server until it becomes available again.
      responses:
        200:
          description: |
            The server accepted the reboot request and will restart shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: restarting
  /api/v1/prompts/{prompt_id}:
    get:
      operationId: get_prompt
      summary: (API) Get prompt status
      parameters:
        - in: path
          name: prompt_id
          schema:
            type: string
          required: true
          description: |
            The ID of the prompt to query.
      responses:
        204:
          description: |
            The prompt is still in progress
        200:
          description: |
            Prompt outputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outputs"
        404:
          description: |
            The prompt was not found
        500:
          description: |
            An execution error occurred while processing the prompt.
          content:
            application/json:
              description:
                An execution status directly from the workers
              schema:
                $ref: "#/components/schemas/ExecutionStatusAsDict"
  /api/v1/prompts:
    get:
      operationId: list_prompts
      summary: (API) Get last prompt
      description: |
        Return the last prompt run anywhere that was used to produce an image
        
        The prompt object can be POSTed to run the image again with your own parameters.
        
        The last prompt, whether it was in the UI or via the API, will be returned here.
      responses:
        200:
          description: |
            The last prompt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        404:
          description: |
            There were no prompts in the history to return.
    post:
      operationId: generate
      summary: (API) Generate image
      description: |
        Run a prompt to generate an image.

        Accepts both API-format prompts and UI-format workflows (exported via Save from the ComfyUI web UI). UI workflows are automatically converted to API format before execution.

        Blocks until the image is produced. This may take an arbitrarily long amount of time due to model loading.

        Prompts that produce multiple images will return the last SaveImage output node in the Prompt by default. To return a specific image, remove other
        SaveImage nodes.

        When images are included in your request body, these are saved and their
        filenames will be used in your Prompt.
      responses:
        200:
          headers:
            Digest:
              description: The digest of the request body
              example: SHA256=e5187160a7b2c496773c1c5a45bfd3ffbf25eaa5969328e6469d36f31cf240a3
              schema:
                type: string
            Content-Disposition:
              description: The filename when exactly one SaveImage node is specified.
              example: filename=ComfyUI_00001.png
              schema:
                type: string
                pattern: '^filename=.+'
            Location:
              description: The relative URL to revisit this request
              schema:
                type: string
          description: |
            The content of the last SaveImage node.
          content:
            image/png:
              schema:
                description: |
                  Binary image data. This will be the contents of the last node that returns image outputs in the workflow.
                type: string
                format: binary
            application/json:
              schema:
                description: |
                  The complete outputs dictionary from the workflow.
                type: object
                required:
                  - urls
                  - outputs
                properties:
                  urls:
                    deprecated: true
                    description: |
                      A deprecated list of URLs to binary outputs, whenever save nodes are used.

                      For each SaveImage node, there will be two URLs: the internal URL returned by the worker, and
                      the URL for the image based on the `--external-address` / `COMFYUI_EXTERNAL_ADDRESS` configuration.
                    type: array
                    items:
                      type: string
                  prompt_id:
                    type: string
                    description:
                      The ID of the prompt that was queued and executed
                  outputs:
                    $ref: "#/components/schemas/Outputs"
              example:
                outputs: { }
        202:
          description: |
            The prompt was successfully queued.
          content:
            application/json:
              description: Information about the item that was queued
              schema:
                type: object
                properties:
                  prompt_id:
                    type: string
                    description: The ID of the prompt that was queued
          headers:
            Location:
              description: The relative URL to check on the status of the request
              schema:
                type: string
            Retry-After:
              description: |
                A hint for the number of seconds to check the provided Location for the status of your request.
                
                This is the server's estimate for when the request will be completed.
        204:
          description: |
            The prompt was run but did not contain any SaveImage outputs, so nothing will be returned.
            
            This could be run to e.g. cause the backend to pre-load a model.
        400:
          description: |
            The prompt is invalid.
          content:
            application/json:
              description: A validation error dictionary from the ComfyUI frontend.
              schema:
                $ref: "#/components/schemas/ValidationErrorDict"
        429:
          description: |
            The queue is currently too long to process your request.
        500:
          description: |
            An execution error occurred while processing your prompt.
          content:
            application/json:
              description:
                An execution status directly from the workers
              schema:
                $ref: "#/components/schemas/ExecutionStatusAsDict"
        507:
          description: |
            The server had an IOError like running out of disk space.
        503:
          description: |
            The server is too busy to process this request right now.
            
            This should only be returned by a load balancer. Standalone comfyui does not return this.
      parameters:
        - in: header
          name: Accept
          schema:
            type: string
            enum:
              - "application/json"
              - "image/png"
              - "application/json+respond-async"
          required: false
          description: |
            Specifies the media type the client is willing to receive.
            
            If +respond-async is specified after your Accept mimetype, the request will be run async and you will get 202 when the prompt was queued.
        - in: header
          title: prefer_header
          name: Prefer
          schema:
            type: string
            enum:
              - "respond-async"
              - ""
          required: false
          allowEmptyValue: true
          description: |
            When respond-async is in your Prefer header, the request will be run async and you will get 202 when the prompt was queued.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prompt"
          multipart/formdata:
            schema:
              type: object
              properties:
                prompt:
                  $ref: "#/components/schemas/Prompt"
                files:
                  description: |
                    Files to upload along with this request.
                    
                    The filename specified in the content-disposition can be used in your Prompt.
                  type: array
                  items:
                    type: string
                    format: binary
components:
  schemas:
    InputSpec:
      type: array
      prefixItems:
        - oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        - type: object
          properties:
            default:
              type: string
            min:
              type: number
            max:
              type: number
            step:
              type: number
            multiline:
              type: boolean
      items: false
    Node:
      type: object
      properties:
        input:
          type: object
          required:
            - required
          properties:
            required:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/InputSpec"
            optional:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/InputSpec"
            hidden:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/InputSpec"
        output:
          type: array
          items:
            type: string
        output_is_list:
          description: Indicates if the output of the corresponding index as the item in this array is a list output.
          type: array
          items:
            type: boolean
        output_name:
          type: array
          items:
            type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        category:
          type: string
        output_node:
          type: boolean
    ExtraData:
      type: object
      properties:
        extra_pnginfo:
          type: object
          properties:
            workflow:
              $ref: "#/components/schemas/Workflow"
    Prompt:
      type: object
      description: |
        An API-format prompt or a UI-format workflow.

        API format: keys are stringified integers corresponding to nodes, values are PromptNode objects.
        UI format: a LiteGraph workflow object with "nodes" and "links" arrays (exported via Save from the web UI). UI workflows are automatically converted to API format.

        You can retrieve the last prompt run using GET /api/v1/prompts
      additionalProperties:
        $ref: '#/components/schemas/PromptNode'
    PromptNode:
      type: object
      required:
        - class_type
        - inputs
      properties:
        _meta:
          type: object
          properties:
            title:
              type: string
              description: |
                The title of the node when authored in the workflow. Set only when the end user changed it using the
                panel properties in the UI.
        class_type:
          type: string
          description: The node's class type, which maps to a class in NODE_CLASS_MAPPINGS.
        inputs:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
              - type: boolean
              - type: array
                description: |
                  When this is specified, it is a node connection, followed by an output.
                minItems: 2
                maxItems: 2
                prefixItems:
                  - type: string
                  - type: integer
          description: The inputs for the node, which can be scalar values or references to other nodes' outputs.
        is_changed:
          oneOf:
            - type: array
              description: An array of hashes representing whether the node has changed (optional).
              items:
                type: string
            - type: string
              description: A string representing whether the node has changed (optional).
    Workflow:
      type: object
      properties:
        last_node_id:
          type: integer
        last_link_id:
          type: integer
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string
              pos:
                type: array
                maxItems: 2
                minItems: 2
                items:
                  type: number
              size:
                type: object
                properties:
                  "0":
                    type: number
                  "1":
                    type: number
              flags:
                type: object
                additionalProperties:
                  type: object
              order:
                type: integer
              mode:
                type: integer
              inputs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    link:
                      type: integer
              outputs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    links:
                      type: array
                      items:
                        type: integer
                    slot_index:
                      type: integer
              properties:
                type: object
              widgets_values:
                type: array
                items:
                  type: string
        links:
          type: array
          items:
            type: array
            items:
              minItems: 6
              maxItems: 6
              oneOf:
                - type: integer
                - type: string
        groups:
          type: array
          items:
            type: object
        config:
          type: object
        extra:
          type: object
        version:
          type: number
    PromptRequest:
      type: object
      required:
        - prompt
      properties:
        client_id:
          type: string
        prompt:
          $ref: "#/components/schemas/Prompt"
        extra_data:
          $ref: "#/components/schemas/ExtraData"
    QueueTuple:
      type: array
      description: |
        An item that was added to the queue.
      minItems: 3
      maxItems: 5
      prefixItems:
        - type: number
          description: Queue priority.
        - type: string
          description: The hash id of the prompt object. This should be the the prompt ID.
        - $ref: "#/components/schemas/Prompt"
        - $ref: "#/components/schemas/ExtraData"
        - type: array
          description: A list of "good output" node IDs in the prompt.
          items:
            type: string
    Outputs:
      description: |
        The keys are node IDs, the values are output objects.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Output"
    Output:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/FileOutput"
        latents:
          type: array
          items:
            $ref: "#/components/schemas/FileOutput"
      additionalProperties:
        $ref: "#/components/schemas/FileOutput"
    FileOutput:
      type: object
      required:
        - filename
        - subfolder
        - type
        - abs_path
      properties:
        filename:
          type: string
        subfolder:
          type: string
        type:
          type: string
        abs_path:
          type: string
    ArbitraryObject:
      type: object
      additionalProperties: true
    UploadImageResponse:
      type: object
      properties:
        name:
          type: string
        subfolder:
          type: string
        type:
          type: string
    ModelFolderInfo:
      type: object
      required: [name, folders]
      properties:
        name:
          type: string
        folders:
          type: array
          items:
            type: string
    ModelFileInfo:
      type: object
      required: [name, pathIndex]
      properties:
        name:
          type: string
        pathIndex:
          type: integer
        modified:
          type: number
        created:
          type: number
        size:
          type: integer
    DeviceStats:
      type: object
      required: [name, type, index, vram_total, vram_free, torch_vram_total, torch_vram_free]
      properties:
        name:
          type: string
        type:
          type: string
        index:
          type: integer
        vram_total:
          type: number
        vram_free:
          type: number
        torch_vram_total:
          type: number
        torch_vram_free:
          type: number
    SystemStats:
      type: object
      required: [system, devices]
      properties:
        system:
          type: object
          required: [os, python_version, embedded_python, comfyui_version, pytorch_version, argv, ram_total, ram_free]
          properties:
            os:
              type: string
            python_version:
              type: string
            embedded_python:
              type: boolean
            comfyui_version:
              type: string
            pytorch_version:
              type: string
            required_frontend_version:
              type: string
            comfyui_frontend_version:
              type: string
            workflow_templates_version:
              type: string
            installed_templates_version:
              type: string
            required_templates_version:
              type: string
            cloud_version:
              type: string
            argv:
              type: array
              items:
                type: string
            ram_total:
              type: number
            ram_free:
              type: number
          additionalProperties: true
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceStats"
    UserConfig:
      type: object
      required: [storage]
      properties:
        storage:
          type: string
          enum: [server]
        migrated:
          type: boolean
        users:
          type: object
          additionalProperties:
            type: string
    Settings:
      type: object
      additionalProperties: true
    UserDataFileInfo:
      type: object
      required: [path, size, modified]
      properties:
        path:
          type: string
        size:
          type: integer
        modified:
          type: number
        created:
          type: number
    LogEntry:
      type: object
      required: [t, m]
      properties:
        t:
          type: string
        m:
          type: string
    TerminalSize:
      type: object
      required: [cols]
      properties:
        cols:
          type: number
        rows:
          type: number
        row:
          type: number
    LogsRawResponse:
      type: object
      required: [entries, size]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        size:
          $ref: "#/components/schemas/TerminalSize"
    FolderPaths:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    GlobalSubgraphInfo:
      type: object
      properties:
        node_pack:
          type: string
      additionalProperties: true
    GlobalSubgraphSummary:
      type: object
      properties:
        source:
          type: string
        name:
          type: string
        info:
          $ref: "#/components/schemas/GlobalSubgraphInfo"
      additionalProperties: true
    GlobalSubgraphDetail:
      allOf:
        - $ref: "#/components/schemas/GlobalSubgraphSummary"
        - type: object
          properties:
            data:
              type: string
          additionalProperties: true
    WorkflowTemplatesMap:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    CustomNodesI18n:
      type: object
      additionalProperties: true
    PreviewOutput:
      type: object
      required:
        - nodeId
        - mediaType
      properties:
        filename:
          type: string
        subfolder:
          type: string
        type:
          type: string
          enum: [output, input, temp]
        nodeId:
          type: string
        mediaType:
          type: string
        display_name:
          type: string
      additionalProperties: true
    JobExecutionError:
      type: object
      required:
        - node_id
        - node_type
        - exception_message
        - exception_type
        - traceback
        - current_inputs
        - current_outputs
      properties:
        prompt_id:
          type: string
        timestamp:
          type: number
        node_id:
          type: string
        node_type:
          type: string
        executed:
          type: array
          items:
            type: string
        exception_message:
          type: string
        exception_type:
          type: string
        traceback:
          type: array
          items:
            type: string
        current_inputs: {}
        current_outputs: {}
      additionalProperties: true
    JobListItem:
      type: object
      required:
        - id
        - status
        - create_time
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled]
        create_time:
          type: number
        execution_start_time:
          type: number
          nullable: true
        execution_end_time:
          type: number
          nullable: true
        preview_output:
          allOf:
            - $ref: "#/components/schemas/PreviewOutput"
          nullable: true
        outputs_count:
          type: integer
          nullable: true
        execution_error:
          allOf:
            - $ref: "#/components/schemas/JobExecutionError"
          nullable: true
        workflow_id:
          type: string
          nullable: true
        priority:
          type: number
      additionalProperties: true
    JobWorkflowContainer:
      type: object
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        extra_data:
          $ref: "#/components/schemas/ExtraData"
      additionalProperties: true
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/JobListItem"
        - type: object
          properties:
            workflow:
              $ref: "#/components/schemas/JobWorkflowContainer"
            outputs:
              $ref: "#/components/schemas/Outputs"
            update_time:
              type: number
            execution_status: {}
            execution_meta: {}
          additionalProperties: true
    PaginationInfo:
      type: object
      required:
        - offset
        - limit
        - total
        - has_more
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
    JobsListResponse:
      type: object
      required:
        - jobs
        - pagination
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobListItem"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
    ValidationErrorDict:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: string
        extra_info:
          type: object
          required:
            - exception_type
            - traceback
          properties:
            exception_type:
              type: string
            traceback:
              type: array
              items:
                type: string
            node_errors:
              type: object
              description: "Detailed validation errors per node"
              additionalProperties:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidationErrorDict"
                  dependent_outputs:
                    type: array
                    items:
                      type: string
                  class_type:
                    type: string
      required:
        - type
        - details
        - extra_info
        - message
    ExecutionStatusAsDict:
      type: object
      required:
        - status_str
        - completed
        - messages
      properties:
        status_str:
          type: string
          enum:
            - "success"
            - "error"
        completed:
          type: boolean
        messages:
          type: array
          items:
            type: string
