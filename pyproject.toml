[project]
name = "comfyui"
version = "0.18.2"
description = "An installable version of ComfyUI"
readme = "README.md"
authors = [
    { name = "Contributors_of_ComfyUI" },
]
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    # todo: it looks like there are breaking frontend package changes, so this really does need to be pinned?
    "comfyui-frontend-package>=1.42.10,<1.45",
    "comfyui-workflow-templates>=0.9.44,<0.10",
    "comfyui-embedded-docs>=0.4.3",
    "comfy_kitchen>=0.2.8",
    "comfy-aimdo>=0.2.12",
    # todo: what should this really be? what's the idea?
    "comfyui_manager>=4.1,<5",
    "torch",
    "torchvision",
    "torchaudio",
    "torchdiffeq>=0.2.3",
    "torchsde>=0.2.6",
    "einops>=0.6.0",
    "open-clip-torch>=2.24.0",
    "transformers>=4.57.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "peft>=0.10.0",
    "torchinfo",
    "safetensors>=0.4.2",
    "aiohttp>=3.13.2",
    "yarl>=1.22.0",
    "accelerate>=0.25.0",
    "pyyaml>=6.0",
    "scikit-image>=0.20.0",
    "jsonmerge>=1.9.0",
    "clean-fid>=0.1.35",
    "resize-right>=0.0.2",
    "opencv-python-headless>=4.9.0.80",
    "albumentations>=1.3.0",
    "aiofiles>=23.1.0",
    "frozendict>=2.3.6",
    "python-dateutil>=2.8.2",
    "importlib_resources",
    "Pillow",
    "scipy",
