[project]
name = "comfyui"
version = "0.20.3"
description = "An installable version of ComfyUI"
readme = "README.md"
authors = [
    { name = "Contributors_of_ComfyUI" },
]
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    # todo: it looks like there are breaking frontend package changes, so this really does need to be pinned?
    "comfyui-frontend-package>=1.42.15,<1.45",
    "comfyui-workflow-templates>=0.9.63,<0.10",
    "comfyui-embedded-docs>=0.4.4,<0.5",
    "comfy_kitchen>=0.2.8",
    "comfy-aimdo>=0.3.0,<0.4",
    # todo: what should this really be? what's the idea?
    "comfyui_manager>=4.1,<5",
    "torch",
    "torchvision",
    "torchaudio",
    "torchdiffeq>=0.2.3",
    "torchsde>=0.2.6",
    "einops>=0.6.0",
    "open-clip-torch>=2.24.0",
    "transformers>=4.57.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "peft>=0.10.0",
    "torchinfo",
    "safetensors>=0.4.2",
    "aiohttp>=3.13.2",
    "yarl>=1.22.0",
    "accelerate>=0.25.0",
    "pyyaml>=6.0",
    "scikit-image>=0.20.0",
    "jsonmerge>=1.9.0",
    "clean-fid>=0.1.35",
    "resize-right>=0.0.2",
    "opencv-python-headless>=4.9.0.80",
    "albumentations>=1.3.0",
    "aiofiles>=23.1.0",
    "frozendict>=2.3.6",
    "python-dateutil>=2.8.2",
    "importlib_resources",
    "Pillow",
    "scipy",
    "simpleeval>=1.0.3",
    "tqdm",
    "protobuf>=3.20.0",
    "psutil",
    "ConfigArgParse>=1.7.1",
    "aio-pika",
    "pyjwt[crypto]",
    "kornia>=0.7.0",
    "mpmath>=1.0,!=1.4.0a0",
    "huggingface_hub[hf_xet]>=0.32.0",
    "lazy-object-proxy",
    "lazy_loader>=0.3",
    "can_ada",
    "fsspec",
    "yt-dlp",
    "natsort",
    "OpenEXR; python_version < '3.14'",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-propagator-jaeger>=1.29.0",
    "opentelemetry-instrumentation>=0.50b0",
    "opentelemetry-util-http>=0.50b0",
    "opentelemetry-instrumentation-aio-pika>=0.50b0",
    "opentelemetry-instrumentation-requests>=0.50b0",
    "opentelemetry-instrumentation-aiohttp-server>=0.50b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.50b0",
    "opentelemetry-instrumentation-asyncio>=0.50b0",
    "opentelemetry-instrumentation-urllib3>=0.50b0",
    "opentelemetry-processor-baggage>=0.50b0",
    "opentelemetry-semantic-conventions>=0.50b0",
    "wrapt>=1.16.0",
    "certifi",
    "spandrel>=0.3.4",
    # https://github.com/conda-forge/numba-feedstock/issues/158 until numba is released with support for a later version of numpy
    "numpy>=1.24.4,<2.3",
    "soundfile>=0.13 ; sys_platform != 'darwin'",
    "soundfile>=0.12,<0.13 ; sys_platform == 'darwin'",
    "watchdog",
    "basedpyright",
    "networkx>=2.6.3",
    "joblib",
    "jaxtyping",
    "spandrel_extra_arches",
    "ml_dtypes",
    "diffusers>=0.30.1",
    "vtracer",
    "skia-python",
    "pebble>=5.0.7",
    "openai",
    "anthropic",
    "pydantic-ai-slim[openai,anthropic,google]>=0.0.36; python_version>='3.11'",
    "google-generativeai",
    "humanize",
    "jax",
    "colour",
    "av>=14.2.0,<16",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "typer",
    "questionary",
    "ijson",
    "scikit-learn>=1.4.1",
    # everything that is a torch extension will need setuptools, so just include it
    "setuptools",
    "alembic",
    "SQLAlchemy>=2.0,<3",
    "gguf",
    "trimesh",
    "glfw",
    "PyOpenGL",
    # doesn't support linux correctly yet
    "stringzilla<4.2.0",
    "requests_cache",
    "universal_pathlib",
    # yanked propcache is omitted
    # we want this upgraded
    "propcache>=0.4.1",
    "blake3",
    "requests",
    "matrix-nio",
    "rich",
    "fp4-fp8-for-torch-mps ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-aiohttp",
    "pytest-xdist",
    "pytest-timeout",
    "websocket-client>=1.6.1",
    "PyInstaller",
    "testcontainers",
    "testcontainers-rabbitmq",
    "mypy>=1.6.0",
    "freezegun",
    "coverage",
    "pylint",
    "astroid",
    "ruff>=0.15",
    "nvidia-ml-py",
    "playwright",
]

[project.scripts]
comfyui = "comfy.cmd.cli:entrypoint"
comfyui-worker = "comfy.entrypoints.worker:entrypoint"
comfyui-workflow = "comfy.entrypoints.workflow:entrypoint"

[project.entry-points."fsspec.specs"]
pkg = "comfy.component_model.package_filesystem:PkgResourcesFileSystem"
civitai = "comfy.component_model.civitai_fsspec:CivitaiFileSystem"
civitai-red = "comfy.component_model.civitai_fsspec:CivitaiRedFileSystem"
youtube = "comfy.component_model.youtube_fsspec:YouTubeFileSystem"

[project.urls]
Homepage = "https://github.com/comfyanonymous/ComfyUI"
Repository = "https://github.com/comfyanonymous/ComfyUI"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W ignore --no-header -q -p no:logging --tb=long"
asyncio_mode = "auto"
timeout = 300
timeout_method = "thread"
faulthandler_timeout = 600
filterwarnings = [
    "ignore",
]

[tool.ruff]
# Ruff is the primary linter. Pylint runs only the custom checkers in
# `tests/*_checker.py` — see [tool.pylint.master] below.
target-version = "py310"

lint.select = [
    "S307",  # suspicious-eval-usage
    "S102",  # exec
    "E",     # pycodestyle errors
    "T",     # flake8-print
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (covers undefined-name, used-before-assignment-style bugs)
    "B",     # flake8-bugbear (mutable default args, broad except, etc.)
]

# Match the same suppressions pylint's [tool.pylint.messages_control] had —
# stylistic and refactor-grade rules are off; bug-class rules stay on.
lint.ignore = [
    # E/W stylistic (matches pylint's disable list)
    "E501",   # line-too-long  (pylint: line-too-long)
    "E701",   # multiple-statements-on-one-line-colon (pylint: multiple-statements)
    "E702",   # multiple-statements-on-one-line-semicolon
    "E721",   # type-comparison (pylint: unidiomatic-typecheck)
    "E722",   # bare-except    (pylint: bare-except)
    "E731",   # lambda-assignment
    "E712",   # comparison-to-true
    "E402",   # module-import-not-at-top  (pylint: wrong-import-position)
    "E741",   # ambiguous-variable-name   (pylint: invalid-name)
    "W291",   # trailing-whitespace
    "W292",   # missing-final-newline     (pylint: missing-final-newline)
    "W293",   # whitespace-on-blank-line  (pylint: trailing-whitespace)

    # Pyflakes
    "F403",   # star-import-undef   (legacy ldm modules star-import freely)
    "F405",   # may-be-undefined-from-star-imports
    "F541",   # f-string-without-placeholders
    "F841",   # unused-variable

    # Bugbear — refactor / stylistic suggestions, not bug-class
    "B006",   # mutable-default-arg (pylint: dangerous-default-value, disabled)
    "B007",   # unused-loop-variable
    "B008",   # function call in default arg (pydantic/typer convention)
    "B009",   # getattr with constant attribute
    "B010",   # setattr with constant attribute
    "B011",   # assert False
    "B017",   # broad pytest.raises
    "B019",   # lru_cache on methods (memory-leak warning, but used intentionally)
    "B023",   # loop-var captured by closure
    "B024",   # abstract base class without abstract methods
    "B026",   # star-arg unpacking after kw-only
    "B027",   # empty method in ABC without @abstractmethod
    "B028",   # warnings.warn without stacklevel
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-strict
]

# Mirror pylint's ignore-paths plus vendored third-party.
exclude = [
    "*.ipynb",
    "**/generated/*.pyi",
    "comfy/api/**",
    "comfy/alembic_db/**",
    "comfy/vendor/**",
    "comfy_extras/controlnet_aux/**",  # vendored 3rd-party, has `# pylint: skip-file`
]

# CLI / script files legitimately use ``print()`` — silence T201 there.
# nodes_eval.py is the EvalNode whose entire purpose is exec(); silence S102.
# nodes_cosmos_upsampling.py uses .strip() with multiple chars intentionally.
[tool.ruff.lint.per-file-ignores]
"comfy/app/colab.py" = ["T201"]
"comfy/cmd/cli.py" = ["T201"]
"comfy/cmd/list_models.py" = ["T201"]
"comfy/cmd/openapi_gen.py" = ["T201"]
"comfy/cmd/snapshot_pip_registry.py" = ["T201"]
"comfy/cmd/folder_paths.py" = ["F822"]  # __all__ entries provided dynamically by module property
"comfy_extras/nodes/nodes_eval.py" = ["S102"]
"comfy_extras/nodes/nodes_cosmos_upsampling.py" = ["B005"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["comfy/", "comfy_extras/", "comfy_api/", "comfy_api_nodes/", "comfy_config/", "comfy_execution/", "comfy_compatibility/"]

[tool.pylint.master]
# Pylint runs *only* the custom checkers in tests/*_checker.py — ruff
# (configured in [tool.ruff] above) handles every built-in pylint rule
# we care about. The default profile is turned off via ``disable = ["all"]``;
# only the custom plugins' message symbols are explicitly re-enabled below.
py-version = "3.10"
ignore-paths = ["^comfy/api/.*$", "^comfy/alembic_db/.*$"]
ignored-modules = ["sentencepiece.*", "comfy.api", "comfy.cmd.folder_paths"]
init-hook = 'import sys; sys.path.insert(0, ".")'
load-plugins = [
    "tests.absolute_import_checker",
    "tests.main_pre_import_checker",
    "tests.missing_init",
    "tests.root_comfy_extras_nodes_checker",
    "tests.sd_clip_model_init_checker",
]
persistent = true
fail-under = 10
jobs = 0  # auto-detect cores

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "absolute-import-used",            # W0001 — tests/absolute_import_checker.py
    "main-pre-import-not-first",       # W0002 — tests/main_pre_import_checker.py
    "missing-init",                    # W8001 — tests/missing_init.py
    "root-comfy-extras-nodes-file",    # W8002 — tests/root_comfy_extras_nodes_checker.py
    "sd-clip-model-missing-config",    # W9001 — tests/sd_clip_model_init_checker.py
]
