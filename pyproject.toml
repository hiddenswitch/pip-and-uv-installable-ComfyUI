[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-aiohttp",
    "pytest-xdist",
    "pytest-timeout",
    "websocket-client>=1.6.1",
    "PyInstaller",
    "testcontainers",
    "testcontainers-rabbitmq",
    "mypy>=1.6.0",
    "freezegun",
    "coverage",
    "pylint",
    "astroid",
    "nvidia-ml-py",
    "playwright",
    "comfyui-ollama",
    "comfyui-sam2",
    "comfyui-custom-scripts",
]

[project.scripts]
comfyui = "comfy.cmd.cli:entrypoint"
comfyui-worker = "comfy.entrypoints.worker:entrypoint"
comfyui-workflow = "comfy.entrypoints.workflow:entrypoint"

[project.entry-points."fsspec.specs"]
pkg = "comfy.component_model.package_filesystem:PkgResourcesFileSystem"

[project.urls]
Homepage = "https://github.com/comfyanonymous/ComfyUI"
Repository = "https://github.com/comfyanonymous/ComfyUI"

[[tool.uv.index]]
name = "appmana-nodes"
url = "https://nodes.appmana.com/simple"

[tool.uv.sources]
comfyui-ollama = { index = "appmana-nodes" }
comfyui-sam2 = { index = "appmana-nodes" }
comfyui-custom-scripts = { index = "appmana-nodes" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W ignore --no-header -q -p no:logging"
asyncio_mode = "auto"
filterwarnings = [
    "ignore",
]

[tool.ruff]
lint.select = [
    "N805", # invalid-first-argument-name-for-method
    "S307", # suspicious-eval-usage
    "S102", # exec
    "E",
  "T", # print-usage
    "W", # pycodestyle Warnings
    "F", # Pyflakes
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]

exclude = ["*.ipynb", "**/generated/*.pyi"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["comfy/", "comfy_extras/", "comfy_api/", "comfy_api_nodes/", "comfy_config/", "comfy_execution/", "comfy_compatibility/"]

[tool.pylint.master]
py-version = "3.10"
extension-pkg-allow-list = ["pydantic", "cv2", "transformers", "av"]
ignore-paths = ["^comfy/api/.*$", "^comfy/alembic_db/.*$"]
ignored-modules = ["sentencepiece.*", "comfy.api", "comfy.cmd.folder_paths"]
init-hook = 'import sys; sys.path.insert(0, ".")'
load-plugins = ["tests.absolute_import_checker", "tests.main_pre_import_checker", "tests.missing_init", "tests.root_comfy_extras_nodes_checker", "tests.sd_clip_model_init_checker"]
persistent = true
fail-under = 10
jobs = 1
limit-inference-results = 100
unsafe-load-any-extension = false

