      - messages
      properties:
        status_str:
          type: string
          enum:
          - success
          - error
        completed:
          type: boolean
        messages:
          type: array
          items:
            type: string
    CreateWorkflowRequest:
      description: Request body for creating a new saved workflow.
      properties:
        default_view:
          description: Default view mode
          enum:
          - workflow
          - app
          type: string
        description:
          description: Description of the workflow
          type: string
        forked_from_workflow_id:
          description: ID of the source workflow if forked
          type: string
        forked_from_workflow_version_id:
          description: ID of the source workflow version if forked
          type: string
        name:
          description: Display name for the workflow
          type: string
        workflow_json:
          additionalProperties: true
          description: The ComfyUI workflow JSON
          type: object
      required:
      - workflow_json
      type: object
    FeedbackResponse:
      description: Response after submitting feedback
      type: object
    ForkWorkflowRequest:
      description: Request body for forking an existing workflow into the user's account.
      properties:
        name:
          description: Name for the forked workflow
          type: string
        source_version:
          description: Version number to fork from
          type: integer
      required:
      - source_version
      type: object
    JobsCancelRequest:
      additionalProperties: false
      description: Request to cancel multiple jobs by ID.
      properties:
        job_ids:
          description: Job identifiers (UUIDs) to cancel.
          items:
            format: uuid
            type: string
          maxItems: 100
          minItems: 1
          type: array
      required:
      - job_ids
      type: object
    JobsCancelResponse:
      description: Response for POST /api/jobs/cancel.
      properties:
        cancelled:
          description: 'Job IDs for which a cancel event was successfully dispatched by this

            call. Jobs already in a terminal or cancelling state are idempotently

            skipped and will not appear here.

            '
          items:
            type: string
          type: array
      required:
      - cancelled
      type: object
    PublishWorkflowAssetsRequest:
      description: Request body for publishing workflow assets to the Hub.
      properties:
        asset_ids:
          description: IDs of assets (inputs and models) to snapshot.
          items:
            type: string
          type: array
      required:
      - asset_ids
      type: object
    UpdateWorkflowRequest:
      description: Request body for updating an existing saved workflow.
      properties:
        default_view:
          description: New default view mode
          enum:
          - workflow
          - app
          type: string
        description:
          description: New description
          type: string
        name:
          description: New display name
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: 'API key authentication. Keys are prefixed with ''comfyui-'' and can be

        generated from user account settings. Example: ''comfyui-abc123...''

        '
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      bearerFormat: JWT
      description: 'Firebase JWT token authentication. Obtain a token by authenticating

        with Firebase and pass it in the Authorization header.

        '
      scheme: bearer
      type: http
    CookieAuth:
      description: 'Session cookie authentication. Set automatically after successful

        login via the /api/auth/session endpoint.

        '
      in: cookie
      name: session
      type: apiKey
security:
- ApiKeyAuth: []
- BearerAuth: []
