  /api/vhs/queryvideo:
    get:
      operationId: getVhsQueryVideo
      tags:
      - view
      summary: Query VHS video metadata
      description: '[cloud-only] Returns metadata about a video file processed by the VHS (Video Helper Suite) integration.'
      x-runtime:
      - cloud
      parameters:
      - name: filename
        in: query
        required: true
        schema:
          type: string
        description: Video filename
      - name: type
        in: query
        schema:
          type: string
          enum:
          - input
          - output
          - temp
        description: Directory type
      - name: subfolder
        in: query
        schema:
          type: string
        description: Subfolder within the directory
      responses:
        '200':
          description: Video metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  source:
                    description: Source video metadata
                    properties:
                      duration:
                        description: Duration in seconds
                        type: number
                      fps:
                        description: Frames per second
                        type: number
                      frames:
                        description: Total frame count
                        type: integer
                      size:
                        description: '[width, height] in pixels'
                        items:
                          type: integer
                        maxItems: 2
                        minItems: 2
                        type: array
                    required:
                    - size
                    - fps
                    - frames
                    - duration
                    type: object
                required:
                - source
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '400':
          description: 'Missing required query parameter. Produced by the oapi-codegen wrapper via echo.NewHTTPError, so the
            body shape matches Echo''s default HTTPError serialization rather than ErrorResponse. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      - CookieAuth: []
