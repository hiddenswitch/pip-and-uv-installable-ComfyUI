      properties:
        name:
          type: string
          description: Device name
        type:
          type: string
          description: Device type (cuda, mps, cpu, etc.)
        index:
          type: number
          nullable: true
          description: 'Device index within its type (e.g. CUDA ordinal for `cuda:0`,

            `cuda:1`). `null` for devices with no index, including the CPU

            device returned in `--cpu` mode (PyTorch''s `torch.device(''cpu'').index`

            is `None`).

            '
        vram_total:
          type: number
          description: Total VRAM in bytes
        vram_free:
          type: number
          description: Free VRAM in bytes
        torch_vram_total:
          type: number
          description: Total PyTorch-managed VRAM in bytes
        torch_vram_free:
          type: number
          description: Free PyTorch-managed VRAM in bytes
    SystemStatsResponse:
      type: object
      description: Hardware, VRAM, Python, and ComfyUI version information for the running process.
      required:
      - system
      - devices
      properties:
        system:
          type: object
          required:
          - os
          - python_version
          - embedded_python
          - comfyui_version
          - pytorch_version
          - argv
          - ram_total
          - ram_free
          properties:
            os:
              type: string
              description: Operating system
            python_version:
              type: string
              description: Python version
            embedded_python:
              type: boolean
              description: Whether using embedded Python
            comfyui_version:
              type: string
              description: ComfyUI version string
            pytorch_version:
              type: string
              description: PyTorch version
            required_frontend_version:
              type: string
              description: Required frontend version
            argv:
              type: array
              items:
                type: string
              description: Command line arguments
            ram_total:
              type: number
              description: Total RAM in bytes
            ram_free:
              type: number
              description: Free RAM in bytes
            installed_templates_version:
              type: string
              nullable: true
              description: Version of the currently installed workflow templates
            required_templates_version:
              type: string
              nullable: true
              description: Minimum required workflow templates version for this ComfyUI build
            comfy_package_versions:
              type: array
              description: Installed and required versions for every comfy* package pinned in requirements.txt
              items:
                type: object
                required:
                - name
                - installed
                - required
                properties:
                  name:
                    type: string
                  installed:
                    type: string
                    nullable: true
                  required:
                    type: string
                    nullable: true
            cloud_version:
              description: Cloud ingest service version (commit hash)
              type: string
            comfyui_frontend_version:
              description: ComfyUI frontend version (commit hash or tag)
              type: string
            deploy_environment:
              description: How this ComfyUI instance is deployed (e.g. cloud, local-git, local-portable, local-desktop)
              type: string
            workflow_templates_version:
              description: Workflow templates version
              type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStats'
            properties:
              name:
                description: Device name
                type: string
              type:
                description: Device type
                type: string
              vram_free:
                description: Free VRAM in bytes
                type: number
              vram_total:
                description: Total VRAM in bytes
                type: number
            required:
            - name
            - type
            type: object
    NodeInfo:
      type: object
      description: 'Definition of a registered node class: its inputs, outputs, category, and display metadata.'
      properties:
        input:
