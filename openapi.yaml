        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users:
    get:
      operationId: getUsersInfo
      tags:
      - user
      summary: Get user storage info
      description: 'Returns user storage configuration. In single-user mode returns

        `{"storage": "server", "migrated": true/false}`. In multi-user mode

        returns `{"storage": "server", "users": {"user_id": "user_dir", ...}}`.

        '
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  storage:
                    type: string
                    description: Storage backend type (always "server")
                  migrated:
                    type: boolean
                    description: Whether migration from browser storage is complete (single-user)
                  users:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of user_id to directory name (multi-user)
                required:
                - storage
                - migrated
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createUser
      tags:
      - user
      summary: Create a new user (multi-user mode)
      description: Creates a new user entry. Only meaningful when ComfyUI is running in multi-user mode.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              properties:
                username:
                  type: string
                  description: Username for the new user
      responses:
        '200':
          description: Created user ID
          content:
            application/json:
              schema:
                type: string
                description: The generated user_id
        '400':
          description: Username already exists or invalid
  /api/userdata:
    get:
      operationId: getUserdata
      tags:
      - userdata
      summary: List files in a userdata directory
      description: Lists files in the authenticated user's data directory. Returns either filename strings or full objects
        depending on the `full_info` query parameter.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: dir
        in: query
        required: true
        schema:
          type: string
        description: Directory path relative to the user's data folder
      - name: recurse
        in: query
        schema:
          type: boolean
        description: Recurse into subdirectories
      - name: full_info
        in: query
        schema:
          type: boolean
        description: Return full file info objects instead of just names
      - name: split
        in: query
        schema:
          type: boolean
        description: Split paths into directory components
      responses:
        '200':
          description: File listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserDataResponseFull'
        '404':
          description: Directory not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request (e.g., invalid filename).
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: General error
          content:
            text/plain:
              schema:
                type: string
  /api/v2/userdata:
    get:
      operationId: listUserdataV2
      tags:
      - userdata
      summary: List files in userdata (v2 format)
      description: Lists files in the authenticated user's data directory using the v2 response shape, which always returns
        full objects.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: path
        in: query
        schema:
          type: string
        description: Directory path relative to user data root
      responses:
        '200':
          description: File listing with metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    path:
                      type: string
                    type:
                      type: string
                      enum:
                      - file
                      - directory
                    size:
                      type: integer
                    modified:
                      type: number
                      description: Unix timestamp
        '404':
          description: Not Found — use /api/userdata instead
  /api/userdata/{file}:
    get:
      operationId: getUserdataFile
      tags:
      - userdata
      summary: Read a userdata file
      description: Reads the contents of a file from the authenticated user's data directory.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: file
        in: path
        required: true
        schema:
          type: string
        description: File path relative to user data directory
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request (e.g., invalid filename).
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: General error
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: postUserdataFile
      tags:
      - userdata
      summary: Write or create a userdata file
      description: Writes (creates or replaces) a file in the authenticated user's data directory.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: file
        in: path
        required: true
        schema:
          type: string
        description: File path relative to user data directory
      - name: overwrite
        in: query
        schema:
          type: boolean
        description: Allow overwriting existing files
      - name: full_info
        in: query
        schema:
          type: boolean
        description: Return full file info in response
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema: {}
      responses:
        '200':
          description: File written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponseFull'
        '409':
          description: File exists and overwrite not set
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing or invalid 'file' parameter.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The requested path is not allowed.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: General error
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteUserdataFile
      tags:
      - userdata
      summary: Delete a userdata file
      description: Deletes a file from the authenticated user's data directory.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: file
        in: path
        required: true
        schema:
          type: string
        description: File path relative to user data directory
      responses:
        '204':
          description: File deleted
        '404':
          description: File not found
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error.
          content:
            text/plain:
              schema:
                type: string
  /api/userdata/{file}/move/{dest}:
    post:
      operationId: moveUserdataFile
      tags:
      - userdata
      summary: Move or rename a userdata file
      description: Renames or moves a file within the authenticated user's data directory.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: file
        in: path
        required: true
        schema:
          type: string
        description: Source file path
      - name: dest
        in: path
        required: true
        schema:
          type: string
        description: Destination file path
      - name: overwrite
        in: query
        schema:
          type: boolean
        description: Allow overwriting at destination
      - name: full_info
        in: query
        schema:
          type: boolean
        description: Return full file info in response
      responses:
        '200':
          description: File moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponseFull'
        '404':
          description: Source file not found
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: Destination exists and overwrite not set
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing or invalid parameters.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: General error
          content:
            text/plain:
              schema:
                type: string
  /api/settings:
