          description: Tags associated with the asset
        mime_type:
          type: string
          description: Updated MIME type of the asset
        user_metadata:
          type: object
          additionalProperties: true
          description: Updated custom metadata
        prompt_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: 'Deprecated: use job_id instead. ID of the prompt that created this asset.'
        job_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the job that created this asset
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the update
        display_name:
          description: Display name of the asset. Mirrors name for backwards compatibility.
          nullable: true
          type: string
        file_path:
          description: Relative path in global-namespace-root form (e.g. "models/checkpoints/flux.safetensors")
          nullable: true
          type: string
