        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: updateSettingById
      tags:
      - settings
      summary: Set a single setting value
      description: Sets the value of a single setting, identified by key.
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Setting key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The setting value (any JSON type)
          text/plain:
            schema:
              description: JSON string of the new setting value
              type: string
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                description: Updated setting value response
                properties:
                  value:
                    description: The updated setting value
                type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
