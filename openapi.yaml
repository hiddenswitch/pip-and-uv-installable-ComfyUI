        - **Initial entry** (OAuth params present): validates client/redirect/resource/scopes, persists a server-side authorization-request
        row, and either redirects (no session / unverified email) to the configured frontend login URL carrying only the opaque
        `oauth_request_id`, or returns the JSON consent challenge for the frontend to render.

        - **Resume** (`oauth_request_id` present): loads the server-side row, fails closed if expired/consumed/unknown, returns
        the JSON consent challenge. Browser-replayed OAuth params are intentionally ignored.


        The frontend renders the consent UI from the JSON payload and POSTs the user''s decision back to this endpoint.

        '
      x-runtime:
      - cloud
      security: []
      parameters:
      - name: response_type
        in: query
        required: false
        schema:
          type: string
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: 'RFC 6749 §10.12 marks `state` as RECOMMENDED. Cloud hardening makes it REQUIRED on the initial-entry
          path (omitted only on the resume path where `oauth_request_id` is supplied instead). This parameter is `required:
          false` at the spec level only because the operation is dual-mode (initial entry vs. resume); the runtime rejects
          empty `state` on the initial-entry path with a stable `invalid_request` 400.

          '
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      - name: resource
        in: query
        required: false
        schema:
          type: string
      - name: oauth_request_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Consent challenge payload (session present, email verified). Frontend renders the consent UI from this
            payload and POSTs back to /oauth/authorize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthConsentChallenge'
        '302':
          description: Redirect to login (no session / unverified email) or to registered redirect_uri (pre-validated client
            error)
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Invalid authorize request (pre-redirect failure — unknown client, redirect mismatch, malformed params)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '404':
          description: OAuth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
    post:
      operationId: postOAuthAuthorize
      tags:
      - auth
      summary: '[cloud-only] Submit OAuth consent decision'
      description: '[cloud-only] JSON-only consent submission. The handler verifies the per-row CSRF token, atomically marks
        the authorization request consumed (single-use covers both allow and deny paths), then returns the redirect URL the
        browser must navigate to. The URL contains either `code` + original `state` for allow, or the RFC 6749 §5.2 error
        and `state` for deny.


        Workspace membership is re-checked at submission time. Consent is persisted keyed by `(user_id, client_id, resource_id,
        workspace_id)`; broadening the previously approved scope set requires a fresh consent flow.

        '
      x-runtime:
      - cloud
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - oauth_request_id
              - csrf_token
              - decision
              - workspace_id
              properties:
                oauth_request_id:
                  type: string
                  format: uuid
                csrf_token:
                  type: string
                decision:
                  type: string
                  enum:
                  - allow
                  - deny
                workspace_id:
                  type: string
      responses:
        '200':
          description: Redirect URL for the frontend to navigate to (allow → with code+state; deny → with error+state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizeRedirectResponse'
        '400':
          description: Bad request (CSRF mismatch, expired/consumed request, inaccessible workspace)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '403':
          description: Scope broadening on consent re-grant — fresh consent flow required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '404':
          description: OAuth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
  /oauth/token:
    post:
      operationId: postOAuthToken
      tags:
      - auth
      summary: '[cloud-only] Exchange authorization code or refresh token for a resource-bound access token'
      description: '[cloud-only] OAuth 2.1 token endpoint (RFC 6749 §3.2). Public clients only — `client_secret` is rejected.


        Two grant types are supported:

        - `authorization_code` — exchanges the code minted by `/oauth/authorize` (with PKCE verifier) for an access token
        + first refresh token. Single-use; reuse fails closed.

        - `refresh_token` — rotates the refresh token. Old token immediately invalid; presenting an already-rotated token
        revokes the entire token family and emits a security metric.


        Both grant types re-validate canonical user state, current workspace membership, and the resource''s active flag at
        every mint. A code or refresh token bound to a deactivated resource fails closed.


        Errors follow RFC 6749 §5.2. Logs never contain raw codes, refresh tokens, or minted tokens.


        Per RFC 6749 §5.1, every 200 and 400 response carries `Cache-Control: no-store` and `Pragma: no-cache` so intermediaries
        cannot cache token-bearing or state-change-reason responses.

        '
      x-runtime:
      - cloud
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              properties:
                grant_type:
                  type: string
                  enum:
                  - authorization_code
                  - refresh_token
                client_id:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                scope:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: New token pair
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" per RFC 6749 §5.1
            Pragma:
              schema:
                type: string
              description: Always "no-cache" per RFC 6749 §5.1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: RFC 6749 §5.2 error
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" per RFC 6749 §5.1
            Pragma:
              schema:
                type: string
              description: Always "no-cache" per RFC 6749 §5.1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenError'
        '404':
          description: OAuth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
  /oauth/register:
    post:
      operationId: postOAuthRegister
      tags:
      - auth
      summary: '[cloud-only] Dynamic Client Registration (RFC 7591)'
      description: '[cloud-only] Public, unauthenticated, insert-only RFC 7591 §3.1 client registration. Used by MCP-spec-compliant
        clients to self-register a public OAuth client without operator involvement.


        Policy:


        - Public clients only — `token_endpoint_auth_method` is forced to `none`. Confidential-client registration is out
        of scope this phase.

        - Server-owned `resource_grants`. Caller-supplied `scope` or `resource_grants` is rejected as `invalid_client_metadata`
        (would be a privilege-escalation surface). Dynamic clients receive the same scopes the active resource publishes.

        - Application-type-aware redirect URI policy. `application_type=native` accepts loopback (`127.0.0.1`, `::1`, `localhost`)
        and reverse-DNS-shaped custom schemes; `application_type=web` accepts HTTPS to hosts in an operator-controlled allowlist
        only. `application_type` is REQUIRED on the request — missing or empty rejects with `invalid_client_metadata`.

        - Anti-impersonation: reserved client names are rejected from third parties via NFKC-folded compare.

        - Generated `client_id` carries a stable prefix to distinguish dynamic from seeded clients in audit logs.

        - Cache-Control: `no-store` on every 201 and 400 response (the response carries fresh credentials and rejection reasons).

        '
      x-runtime:
      - cloud
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRegisterRequest'
      responses:
        '201':
          description: Registered. Body echoes the metadata RFC 7591 §3.2.1 requires.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store"
            Pragma:
              schema:
                type: string
              description: Always "no-cache"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRegisterResponse'
        '400':
          description: RFC 7591 §3.2.2 invalid client metadata
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store"
            Pragma:
              schema:
                type: string
              description: Always "no-cache"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRegisterError'
        '404':
          description: OAuth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '503':
          description: No active resource is configured — DCR cannot mint a usable client until an active resource row is
            seeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
