                  description: '[cloud-only] Client-supplied asset ID for idempotent creation. If an asset with this ID already
                    exists, the existing asset is returned.'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCreated'
        '200':
          description: Asset already exists (returned existing asset)
