        '200':
          description: OK
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt_id:
                  type: string
                  description: 'The prompt to interrupt.

                    '
  /free:
    post:
      summary: (UI) Unload models or free memory
      operationId: free_ui
      responses:
        '200':
          description: The free request was accepted. No content body.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  unload_models:
                    type: boolean
                    enum:
                    - true
                required:
                - unload_models
                additionalProperties: false
              - type: object
                properties:
                  free_memory:
                    type: boolean
                    enum:
                    - true
                required:
                - free_memory
                additionalProperties: false
              description: 'A POST request to /free with: {"unload_models":true} will unload models from vram.  A POST request
                to /free with: {"free_memory":true} will unload models and free all cached data from the last run workflow.'
  /users:
    get:
      summary: (UI) Get user configuration
      operationId: get_users_ui
      responses:
        '200':
          description: User mode and storage configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConfig'
    post:
      summary: (UI) Create user
      operationId: post_users_ui
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Created user ID.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid or duplicate username.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /settings:
    get:
      summary: (UI) Get settings
      operationId: get_settings_ui
      responses:
        '200':
          description: User settings dictionary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Unauthorized.
    post:
      summary: (UI) Store settings
      operationId: post_settings_ui
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings updated.
  /settings/{id}:
    get:
      summary: (UI) Get setting
      operationId: get_setting_ui
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Setting value.
          content:
            application/json:
              schema: {}
    post:
      summary: (UI) Store setting
      operationId: post_setting_ui
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Setting updated.
        '400':
          description: Missing setting ID.
  /userdata:
    get:
      summary: (UI) List user data
      operationId: list_userdata_ui
      parameters:
      - in: query
        name: dir
        schema:
          type: string
      - in: query
        name: recurse
        schema:
          type: boolean
      - in: query
        name: full_info
        schema:
          type: boolean
      - in: query
        name: split
        schema:
          type: boolean
      responses:
        '200':
          description: User data entries.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: array
                  items:
                    type: array
                    items:
                      type: string
                - type: array
                  items:
                    $ref: '#/components/schemas/UserDataFileInfo'
        '400':
          description: Invalid directory parameter.
        '403':
          description: Invalid directory.
        '404':
          description: Directory not found.
  /userdata/{file}:
    get:
      summary: (UI) Get user data file
      operationId: get_userdata_ui
      parameters:
      - in: path
        name: file
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid file parameter.
        '403':
          description: Invalid path.
        '404':
          description: File not found.
    post:
      summary: (UI) Store user data file
      operationId: post_userdata_ui
      parameters:
      - in: path
        name: file
        required: true
        schema:
          type: string
      - in: query
        name: overwrite
        schema:
          type: boolean
      - in: query
        name: full_info
        schema:
          type: boolean
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored file path or metadata.
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                - $ref: '#/components/schemas/UserDataFileInfo'
        '403':
          description: Invalid path.
        '409':
          description: File exists and overwrite is false.
    delete:
      summary: (UI) Delete user data file
      operationId: delete_userdata_ui
      parameters:
      - in: path
        name: file
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
  /userdata/{file}/move/{dest}:
    post:
      summary: (UI) Move user data file
      operationId: move_userdata_ui
      parameters:
      - in: path
        name: file
        required: true
        schema:
          type: string
      - in: path
        name: dest
        required: true
        schema:
          type: string
      - in: query
        name: overwrite
        schema:
          type: boolean
      - in: query
        name: full_info
        schema:
          type: boolean
      responses:
        '200':
          description: Moved file path or metadata.
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                - $ref: '#/components/schemas/UserDataFileInfo'
        '404':
          description: Source file not found.
        '409':
          description: Destination exists and overwrite is false.
  /global_subgraphs:
    get:
      summary: (UI) List global subgraphs
      operationId: list_global_subgraphs_ui
      responses:
        '200':
          description: Available global subgraphs keyed by ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/GlobalSubgraphSummary'
  /global_subgraphs/{id}:
    get:
      summary: (UI) Get global subgraph
      operationId: get_global_subgraph_ui
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Global subgraph detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSubgraphDetail'
  /api/v1/reboot:
    post:
      operationId: reboot
      summary: (API) Reboot server
      description: 'Restart the ComfyUI server process. The server shuts down gracefully

        (stopping prompt workers and closing connections), then replaces the

        current process via `os.execv` with the same command-line arguments.


        The response is sent before the shutdown begins. Clients should

        poll the server until it becomes available again.

        '
      responses:
        '200':
          description: 'The server accepted the reboot request and will restart shortly.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: restarting
  /api/v1/prompts/{prompt_id}:
    get:
      operationId: get_prompt
      summary: (API) Get prompt status
      parameters:
      - in: path
        name: prompt_id
        schema:
          type: string
        required: true
        description: 'The ID of the prompt to query.

          '
      responses:
        '204':
          description: 'The prompt is still in progress

            '
        '200':
          description: 'Prompt outputs

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outputs'
        '404':
          description: 'The prompt was not found

            '
        '500':
          description: 'An execution error occurred while processing the prompt.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatusAsDict'
                description: An execution status directly from the workers
  /api/v1/prompts:
    get:
      operationId: list_prompts
      summary: (API) Get last prompt
      description: 'Return the last prompt run anywhere that was used to produce an image


        The prompt object can be POSTed to run the image again with your own parameters.


        The last prompt, whether it was in the UI or via the API, will be returned here.

        '
      responses:
        '200':
          description: 'The last prompt.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
        '404':
          description: 'There were no prompts in the history to return.

            '
    post:
      operationId: generate
      summary: (API) Generate image
      description: 'Run a prompt to generate an image.


        Accepts both API-format prompts and UI-format workflows (exported via Save from the ComfyUI web UI). UI workflows
        are automatically converted to API format before execution.


        Blocks until the image is produced. This may take an arbitrarily long amount of time due to model loading.


        Prompts that produce multiple images will return the last SaveImage output node in the Prompt by default. To return
        a specific image, remove other

        SaveImage nodes.


        When images are included in your request body, these are saved and their

        filenames will be used in your Prompt.

        '
      responses:
        '200':
          headers:
            Digest:
              description: The digest of the request body
              example: SHA256=e5187160a7b2c496773c1c5a45bfd3ffbf25eaa5969328e6469d36f31cf240a3
              schema:
                type: string
            Content-Disposition:
              description: The filename when exactly one SaveImage node is specified.
              example: filename=ComfyUI_00001.png
              schema:
                type: string
                pattern: ^filename=.+
            Location:
              description: The relative URL to revisit this request
              schema:
                type: string
          description: 'The content of the last SaveImage node.

            '
          content:
            image/png:
              schema:
                description: 'Binary image data. This will be the contents of the last node that returns image outputs in
                  the workflow.

                  '
                type: string
                format: binary
            application/json:
              schema:
                description: 'The complete outputs dictionary from the workflow.

                  '
                type: object
                required:
                - urls
                - outputs
                properties:
                  urls:
                    deprecated: true
                    description: 'A deprecated list of URLs to binary outputs, whenever save nodes are used.


                      For each SaveImage node, there will be two URLs: the internal URL returned by the worker, and

                      the URL for the image based on the `--external-address` / `COMFYUI_EXTERNAL_ADDRESS` configuration.

                      '
                    type: array
                    items:
                      type: string
                  prompt_id:
                    type: string
                    description: The ID of the prompt that was queued and executed
                  outputs:
                    $ref: '#/components/schemas/Outputs'
              example:
                urls: []
                outputs: {}
        '202':
          description: 'The prompt was successfully queued.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt_id:
                    type: string
                    description: The ID of the prompt that was queued
                description: Information about the item that was queued
          headers:
            Location:
              description: The relative URL to check on the status of the request
              schema:
                type: string
            Retry-After:
              description: 'A hint for the number of seconds to check the provided Location for the status of your request.


                This is the server''s estimate for when the request will be completed.

                '
              schema:
                type: integer
                minimum: 0
        '204':
          description: 'The prompt was run but did not contain any SaveImage outputs, so nothing will be returned.


            This could be run to e.g. cause the backend to pre-load a model.

            '
        '400':
          description: 'The prompt is invalid.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorDict'
                description: A validation error dictionary from the ComfyUI frontend.
        '429':
          description: 'The queue is currently too long to process your request.

            '
        '500':
          description: 'An execution error occurred while processing your prompt.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatusAsDict'
                description: An execution status directly from the workers
        '507':
          description: 'The server had an IOError like running out of disk space.

            '
        '503':
          description: 'The server is too busy to process this request right now.


            This should only be returned by a load balancer. Standalone comfyui does not return this.

            '
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
          enum:
          - application/json
          - image/png
          - application/json+respond-async
        required: false
        description: 'Specifies the media type the client is willing to receive.


          If +respond-async is specified after your Accept mimetype, the request will be run async and you will get 202 when
          the prompt was queued.

          '
      - in: header
        name: Prefer
        schema:
          type: string
          enum:
          - respond-async
          - ''
        required: false
        description: 'When respond-async is in your Prefer header, the request will be run async and you will get 202 when
          the prompt was queued.

          '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prompt'
          multipart/formdata:
            schema:
              type: object
              properties:
                prompt:
                  $ref: '#/components/schemas/Prompt'
                files:
                  description: 'Files to upload along with this request.


                    The filename specified in the content-disposition can be used in your Prompt.

                    '
                  type: array
                  items:
                    type: string
                    format: binary
  /api/jobs/cancel:
    post:
      description: 'Cancel one or more jobs for the authenticated user in a single request.


        State-agnostic: cancels both pending and running jobs (both transition to

        the cancelled state via the same mechanism as the single-job endpoint).


        Idempotent per job: a job already in a terminal or cancelling state is a

        no-op and simply will not appear in the returned `cancelled` list.


        Fail-fast on unknown IDs: if any provided job ID does not exist for this

        user, the request returns 404 and no jobs are cancelled. This surfaces

        bad IDs to the caller rather than silently dropping them.


        This is the canonical batch-cancel endpoint. The delete operation on

        POST /api/queue is deprecated in favour of this.

        '
      operationId: cancelJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobsCancelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsCancelResponse'
          description: Success - cancel requests dispatched (or jobs were already terminal)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request - job_ids is missing, empty, exceeds the maximum count, or contains an invalid UUID
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: One or more job IDs not found for this user (no jobs cancelled)
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error - cancellation failed
      summary: Cancel multiple jobs
      tags:
      - workflow
  /health:
    get:
      description: 'Returns `200 OK` if the database is reachable and dynamic config has

        loaded, otherwise `503 Service Unavailable`. Used by the GKE ingress

        for health checks. Response body is plain text for probe simplicity.

        '
      operationId: getHealth
      responses:
        '200':
          content:
            text/plain:
              schema:
                example: OK
                type: string
          description: Service is healthy
        '503':
          content:
            text/plain:
              schema:
                example: Service Unavailable
                type: string
          description: Service is unhealthy
      security: []
      summary: Health probe for Kubernetes readiness/liveness
      tags:
      - system
components:
  parameters:
    ComfyUserHeader:
      name: Comfy-User
      in: header
      required: false
      schema:
        type: string
      description: 'Identifies the active user in multi-user mode. Used for settings,

        userdata, and history isolation. This is not a security mechanism —

        it is an organisational convenience with no authentication behind it.

        '
  schemas:
    PromptRequest:
      type: object
      description: A workflow submission. Wraps the prompt graph plus optional client identifier and extra per-request data.
      required:
      - prompt
      properties:
        prompt:
          type: object
          description: 'The workflow graph to execute. Keys are node IDs (strings);

            values are objects with class_type and inputs.

            '
          additionalProperties: true
        number:
          type: number
          description: Priority number for the queue (lower numbers have higher priority)
        front:
          type: boolean
          description: If true, adds the prompt to the front of the queue
        extra_data:
          type: object
          description: Extra data associated with the prompt (e.g. extra_pnginfo)
          additionalProperties: true
        client_id:
          type: string
          description: WebSocket client ID to receive progress updates
        prompt_id:
          type: string
          format: uuid
          description: Client-supplied prompt ID. Server generates a UUID if omitted.
        partial_execution_targets:
          type: array
          items:
            type: string
          description: List of node IDs to execute (partial graph execution)
        workflow_id:
          type: string
          format: uuid
          nullable: true
          x-runtime:
          - cloud
          description: '[cloud-only] Cloud workflow entity ID for tracking and gallery association. Ignored by local ComfyUI.'
        workflow_version_id:
          type: string
          format: uuid
          nullable: true
          x-runtime:
          - cloud
          description: '[cloud-only] Cloud workflow version ID for pinning execution to a specific version. Ignored by local
            ComfyUI.'
    PromptResponse:
      type: object
      description: Server acknowledgement of a workflow submission. Includes the assigned `prompt_id` and current queue position.
      properties:
        prompt_id:
          type: string
          format: uuid
          description: Unique identifier for the prompt execution
        number:
          type: number
          description: Priority number in the queue
        node_errors:
          type: object
          description: Validation errors keyed by node ID
          additionalProperties:
            $ref: '#/components/schemas/NodeError'
        error:
          description: Top-level prompt error (string message or structured error)
          oneOf:
          - type: string
          - $ref: '#/components/schemas/PromptError'
    PromptErrorResponse:
      type: object
      description: Error response when prompt validation fails
      additionalProperties: true
    PromptError:
      type: object
      description: Structured prompt validation error
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: string
    Error:
      type: object
      description: Detailed node-level error
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: string
        extra_info:
          type: object
          properties:
            input_name:
              type: string
          additionalProperties: true
    NodeError:
      type: object
      description: Error details for a single node
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        class_type:
          type: string
          description: The node's class type
        dependent_outputs:
          type: array
          items: {}
    PromptInfo:
      type: object
      description: Summary of a queued or recently-executed prompt, as returned by the queue and history endpoints.
      properties:
        exec_info:
          type: object
          properties:
            queue_remaining:
              type: integer
              description: Number of items remaining in the queue
    QueueInfo:
      type: object
      description: Queue information with pending and running items
      properties:
        queue_running:
          type: array
          description: Currently running queue items
          items:
            type: array
            description: 'Queue item tuple: [number, prompt_id, prompt, extra_data, outputs_to_execute, sensitive]

              '
            items: {}
            prefixItems:
            - type: number
              description: Priority number
            - type: string
              format: uuid
              description: prompt_id
            - type: object
              description: prompt graph
              additionalProperties: true
            - type: object
              description: extra_data
              additionalProperties: true
            - type: array
              description: outputs_to_execute (list of output node IDs)
              items:
                type: string
            - type: object
              description: sensitive data (may be omitted)
              additionalProperties: true
            maxItems: 5
            minItems: 5
        queue_pending:
          type: array
          description: Pending queue items (oldest first)
          items:
            type: array
            description: 'Queue item tuple: [number, prompt_id, prompt, extra_data, outputs_to_execute, sensitive]

              '
            items: {}
            prefixItems:
            - type: number
              description: Priority number
            - type: string
              format: uuid
              description: prompt_id
            - type: object
              description: prompt graph
              additionalProperties: true
            - type: object
              description: extra_data
              additionalProperties: true
            - type: array
              description: outputs_to_execute (list of output node IDs)
              items:
                type: string
            - type: object
              description: sensitive data (may be omitted)
              additionalProperties: true
            maxItems: 5
            minItems: 5
    QueueManageRequest:
      type: object
      description: Request to clear or delete from queue
      properties:
        clear:
          type: boolean
          description: If true, clear all pending items
        delete:
          type: array
          items:
            type: string
          description: Array of prompt IDs to delete from queue
      additionalProperties: false
    QueueManageResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Result of a queue mutation. The Cloud runtime returns which items were deleted and whether
        the queue was cleared; local ComfyUI returns an empty 200 body.'
      properties:
        deleted:
          type: array
          nullable: true
          items:
            type: string
          description: Prompt IDs that were deleted from the queue.
        cleared:
          type: boolean
          nullable: true
          description: Whether the queue was cleared.
    HistoryEntry:
      type: object
      description: A single execution history entry
      properties:
        prompt:
          type: array
          description: 'Prompt tuple: [number, prompt_id, prompt_graph, extra_data, output_node_ids]

            '
          items: {}
          properties:
            extra_data:
              additionalProperties: true
              description: Additional execution data (workflow removed from extra_pnginfo)
              type: object
            priority:
              description: Execution priority
              format: double
              type: number
            prompt_id:
              description: The prompt ID
              type: string
        outputs:
          type: object
          description: Output data from execution keyed by node ID
          additionalProperties: true
        status:
          type: object
          description: Execution status (status_str, completed, messages, etc.)
          additionalProperties: true
        meta:
          type: object
          description: Metadata about the execution and nodes
          additionalProperties: true
        create_time:
          description: Job creation timestamp (Unix timestamp in milliseconds)
          format: int64
          type: integer
        prompt_id:
          description: Unique identifier for this prompt execution
          type: string
        workflow_id:
          description: UUID identifying the workflow graph definition
          type: string
    HistoryManageRequest:
      type: object
      description: Request to clear or delete history entries
      properties:
        clear:
          type: boolean
          description: If true, clear all history
        delete:
          type: array
          items:
            type: string
          description: Array of prompt IDs to delete from history
      additionalProperties: false
    JobEntry:
      type: object
      description: Lightweight job data for list views
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique job identifier (same as prompt_id)
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
          - cancelled
          description: Current job status
        create_time:
          type: integer
          format: int64
          description: Job creation timestamp (Unix milliseconds).
        execution_start_time:
          type: integer
          format: int64
          description: Workflow execution start timestamp (Unix milliseconds, terminal states only).
        execution_end_time:
          type: integer
          format: int64
          description: Workflow execution end timestamp (Unix milliseconds, terminal states only).
        preview_output:
          type: object
          additionalProperties: true
          description: Primary preview output
        outputs_count:
          type: integer
          description: Total number of output files
        workflow_id:
          type: string
          nullable: true
          x-runtime:
          - cloud
          description: '[cloud-only] UUID of the Cloud workflow entity this job is associated with. Local ComfyUI returns
            null.'
        execution_error:
          x-runtime:
          - cloud
          description: '[cloud-only] Detailed execution error from ComfyUI for failed jobs. Absent on local ComfyUI.'
          allOf:
          - $ref: '#/components/schemas/ExecutionError'
    JobDetailResponse:
      type: object
      description: Full job details including workflow and outputs
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique job identifier
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
          - cancelled
          description: User-friendly job status
        workflow:
          type: object
          additionalProperties: true
          description: Full ComfyUI workflow
        outputs:
          type: object
          additionalProperties: true
          description: Full outputs object from execution
        execution_error:
          $ref: '#/components/schemas/ExecutionError'
          allOf:
          - $ref: '#/components/schemas/ExecutionError'
          description: Detailed execution error from ComfyUI (only for failed jobs with structured error data)
        create_time:
          type: integer
          format: int64
          description: Job creation timestamp (Unix milliseconds).
        update_time:
          type: integer
          format: int64
          description: Last state-change timestamp (Unix milliseconds).
        execution_start_time:
          type: integer
          format: int64
          description: Workflow execution start timestamp (Unix milliseconds, terminal states only).
        execution_end_time:
          type: integer
          format: int64
          description: Workflow execution end timestamp (Unix milliseconds, terminal states only).
        preview_output:
          type: object
          additionalProperties: true
          description: Primary preview output (only for terminal states)
        outputs_count:
          type: integer
          description: Total number of output files (omitted for non-terminal states)
        execution_status:
          type: object
          additionalProperties: true
          description: ComfyUI execution status and timeline (only for terminal states)
        execution_meta:
          type: object
          additionalProperties: true
          description: Node-level execution metadata (only for terminal states)
        user_id:
          description: 'ID of the user that owns this job (see the `workspace_id`

            description above for why this is always the caller''s own id

            on a successful response).

            '
          type: string
        workflow_id:
          description: UUID identifying the workflow graph definition
          type: string
        workspace_id:
          description: 'ID of the workspace that owns this job. A successful (200)

            response from this operation is only ever returned for the

            caller''s own job (see this operation''s ownership-scoped

            query), so this is always the caller''s own workspace —

            consumers that also need to correlate this job to its

            live-progress broadcast channel (workspace+user scoped; see

            the internal common/gateways/broadcast package) can use this

            value directly rather than resolving their own identity a

            second way.

            '
          type: string
    ExecutionError:
      type: object
      description: Detailed execution error from ComfyUI
      properties:
        node_id:
          type: string
          description: ID of the node that failed
        node_type:
          type: string
          description: Type name of the node
        exception_message:
          type: string
          description: Human-readable error message
        exception_type:
          type: string
          description: Python exception type
        traceback:
          type: array
          items:
            type: string
          description: Traceback lines
        current_inputs:
          type: object
          additionalProperties: true
          description: Input values at time of failure (empty object if not available)
        current_outputs:
          type: object
          additionalProperties: true
          description: Output values at time of failure (empty object if not available)
      required:
      - node_id
      - node_type
      - exception_message
      - exception_type
      - traceback
      - current_inputs
      - current_outputs
    PaginationInfo:
      type: object
      description: Pagination metadata returned alongside list responses.
      properties:
        offset:
          type: integer
          deprecated: true
          description: 'Current offset (0-based). Deprecated: use cursor-based pagination.'
          minimum: 0
        limit:
          type: integer
          description: Items per page
          minimum: 1
        total:
          type: integer
          description: Total number of items matching filters (may be 0 when using cursor pagination)
          minimum: 0
        has_more:
          type: boolean
          description: Whether more items are available beyond this page
        next_cursor:
          description: 'Opaque cursor for the next page. Pass this value as the `after`

            query parameter on the next request. Empty or absent when there

            are no more results.

            '
          type: string
      required:
      - offset
      - limit
      - total
      - has_more
    UploadResult:
      type: object
