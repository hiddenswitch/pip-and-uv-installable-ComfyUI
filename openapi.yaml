        message:
          type: string
        details:
          type: string
        extra_info:
          type: object
          required:
          - exception_type
          - traceback
          properties:
            exception_type:
              type: string
            traceback:
              type: array
              items:
                type: string
            node_errors:
              type: object
              description: Detailed validation errors per node
              additionalProperties:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationErrorDict'
                  dependent_outputs:
                    type: array
                    items:
                      type: string
