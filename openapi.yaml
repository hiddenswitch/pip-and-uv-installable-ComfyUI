openapi: 3.1.0
info:
  title: ComfyUI API
  description: 'API for ComfyUI - A powerful and modular stable diffusion GUI and backend.


    This API allows you to interact with ComfyUI programmatically, including:

    - Submitting and managing workflow executions

    - Querying node/object information

    - Uploading and viewing files

    - Managing user settings and data

    - Asset management (feature-gated)


    ## Dual-path routing

    Every route registered via `self.routes` in the ComfyUI server is available at

    both its bare path (e.g. `/prompt`) and an `/api`-prefixed path (e.g. `/api/prompt`).

    This spec uses the `/api`-prefixed versions as canonical.


    ## Multi-user mode

    When ComfyUI is started with `--multi-user`, the `Comfy-User` header identifies

    the active user for settings, userdata, and history isolation. This is **not** a

    security mechanism — it is an organisational convenience with no authentication

    or authorisation behind it.

    '
  version: 1.0.0
  license:
    name: GNU General Public License v3.0
    url: https://github.com/comfyanonymous/ComfyUI/blob/master/LICENSE
servers:
- url: /
  description: Default ComfyUI server (typically http://127.0.0.1:8188)
tags:
- name: prompt
  description: Workflow submission and prompt info
- name: queue
  description: Queue inspection and management
- name: history
  description: Execution history
- name: upload
  description: File upload endpoints
- name: view
  description: File viewing / download
- name: system
  description: System stats and feature flags
- name: node
  description: Node / object_info definitions
- name: model
  description: Model folder and file listing
- name: user
  description: User management (multi-user mode)
- name: userdata
  description: Per-user file storage
- name: settings
  description: Per-user settings
- name: extensions
  description: Frontend extension JS files
- name: subgraph
  description: Global subgraph blueprints
- name: internal
  description: Internal / debug endpoints
- name: assets
  description: Asset management (feature-gated behind enable-assets)
- name: auth
  description: Authentication and session management (cloud-only)
- name: billing
  description: Billing, subscriptions, and payment management (cloud-only)
- name: workspace
  description: Workspace and team management (cloud-only)
- name: hub
  description: 'ComfyUI Hub: profiles, shared workflows, and labels (cloud-only)'
- name: workflows
  description: Cloud workflow management and versioning (cloud-only)
- name: task
  description: Background task management (cloud-only)
- name: runtime-only
  description: Operations served exclusively by the cloud runtime with no local equivalent
paths:
  /ws:
    get:
      operationId: connectWebSocket
      tags:
      - system
      summary: WebSocket connection for real-time updates
      description: 'Upgrades to a WebSocket connection that streams execution progress,

        node status, and output messages. The server sends an initial `status`

        message with the session ID (SID) on connect.


        ## Message types (server → client)

        The server sends JSON messages with a `type` field. See the

        `x-websocket-messages` list below for the schema of each message type.

        '
      parameters:
      - name: clientId
        in: query
        required: false
        schema:
          type: string
        description: Client identifier. If omitted the server assigns one.
      responses:
        '101':
          description: WebSocket upgrade successful
        '401':
          description: Unauthorized
      x-websocket-messages:
      - type: status
        schema:
          $ref: '#/components/schemas/StatusWsMessage'
      - type: progress
        schema:
          $ref: '#/components/schemas/ProgressWsMessage'
      - type: progress_text
        schema:
          $ref: '#/components/schemas/ProgressTextWsMessage'
      - type: progress_state
        schema:
          $ref: '#/components/schemas/ProgressStateWsMessage'
      - type: executing
        schema:
          $ref: '#/components/schemas/ExecutingWsMessage'
      - type: executed
        schema:
          $ref: '#/components/schemas/ExecutedWsMessage'
      - type: execution_start
        schema:
          $ref: '#/components/schemas/ExecutionStartWsMessage'
      - type: execution_success
        schema:
          $ref: '#/components/schemas/ExecutionSuccessWsMessage'
      - type: execution_cached
        schema:
          $ref: '#/components/schemas/ExecutionCachedWsMessage'
      - type: execution_interrupted
        schema:
          $ref: '#/components/schemas/ExecutionInterruptedWsMessage'
      - type: execution_error
        schema:
          $ref: '#/components/schemas/ExecutionErrorWsMessage'
      - type: logs
        schema:
          $ref: '#/components/schemas/LogsWsMessage'
      - type: notification
        schema:
          $ref: '#/components/schemas/NotificationWsMessage'
      - type: feature_flags
        schema:
          $ref: '#/components/schemas/FeatureFlagsWsMessage'
      - type: asset_download
        schema:
          $ref: '#/components/schemas/AssetDownloadWsMessage'
      - type: asset_export
        schema:
          $ref: '#/components/schemas/AssetExportWsMessage'
  /api/prompt:
    get:
      operationId: getPromptInfo
      tags:
      - prompt
      summary: Get queue status
      description: Returns how many items remain in the execution queue.
      responses:
        '200':
          description: Queue info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: executePrompt
      tags:
      - prompt
      summary: Submit a workflow for execution
      description: Submits a workflow for execution. The server validates the graph, assigns a `prompt_id`, and enqueues it.
        Clients listen on `/ws` for execution progress and output messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRequest'
      responses:
        '200':
          description: Prompt accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        '400':
          description: Validation or node errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptErrorResponse'
        '402':
          description: Payment required - Insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptErrorResponse'
        '429':
          description: Payment required - User has not paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptErrorResponse'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptErrorResponse'
          description: Workflow JSON too large
  /api/queue:
    get:
      operationId: getQueueInfo
      tags:
      - queue
      summary: Get running and pending queue items
      description: Returns the server's current execution queue, split into the currently-running prompt and the list of pending
        prompts.
      responses:
        '200':
          description: Queue contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueInfo'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - Authentication required
    post:
      operationId: manageQueue
      tags:
      - queue
      summary: Clear or delete items from the queue
      description: Mutates the execution queue. Supports clearing all queued prompts or deleting individual prompts by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueManageRequest'
      responses:
        '200':
          description: Queue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueManageResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
  /api/interrupt:
    post:
      operationId: interruptJob
      tags:
      - queue
      summary: Interrupt current execution
      description: Interrupts the prompt that is currently executing. The next queued prompt (if any) will start immediately
        after.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt_id:
                  type: string
                  format: uuid
                  description: If provided, only interrupts this specific running prompt. Otherwise interrupts all.
      responses:
        '200':
          description: Interrupt signal sent
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
  /api/free:
    post:
      operationId: freeMemory
      tags:
      - queue
      summary: Free GPU memory and/or unload models
      description: Frees GPU memory by unloading models and/or freeing the resident model cache, controlled by the request
        flags.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                unload_models:
                  type: boolean
                  description: Unload all models from VRAM/RAM
                free_memory:
                  type: boolean
                  description: Run garbage collection and free cached memory
      responses:
        '200':
          description: Memory freed
  /api/jobs:
    get:
      operationId: listJobs
      tags:
      - queue
      summary: List jobs with filtering and pagination
      description: Returns a paginated list of completed prompt executions, newest first.
      parameters:
      - name: status
        in: query
        schema:
          type: string
        description: Filter by job status
      - name: workflow_id
        in: query
        schema:
          type: string
        description: Filter by workflow ID
      - name: sort_by
        in: query
        schema:
          type: string
        description: Field to sort by
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort direction
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of results (default is unlimited/None)
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
        description: Pagination offset
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobEntry'
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'
                $ref: '#/components/schemas/JobsListResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request (e.g. malformed pagination cursor).
  /api/jobs/{job_id}:
    get:
      operationId: getJobDetail
      tags:
      - queue
      summary: Get a single job by ID
      description: Returns the full record for a single completed prompt execution, including its outputs, status, and metadata.
      parameters:
      - name: job_id
        in: path
        description: The job (prompt) ID to fetch.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Job does not belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/history:
    get:
      operationId: getPromptHistory
      tags:
      - history
      summary: Get execution history
      deprecated: true
      description: '**Deprecated.** Superseded by `GET /api/jobs`, which returns the same

        execution records in a paginated, filterable format. Planned for removal

        no earlier than a future major release; sunset timeline TBD.


        Returns a dictionary keyed by prompt_id. Each value is a HistoryEntry

        containing prompt metadata, outputs, status, and node meta.

        '
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: max_items
        in: query
        schema:
          type: integer
        description: Maximum number of history entries to return
      - name: offset
        in: query
        schema:
          type: integer
        description: Pagination offset (number of entries to skip)
      responses:
        '200':
          description: History dictionary keyed by prompt_id
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/HistoryEntry'
        '404':
          description: Not Found — use /api/history_v2 instead
    post:
      operationId: manageHistory
      tags:
      - history
      summary: Clear or delete history entries
      deprecated: true
      description: '**Deprecated.** Superseded by the forthcoming job-management endpoints

        under `/api/jobs`. Planned for removal no earlier than a future major

        release; sunset timeline TBD.

        '
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryManageRequest'
      responses:
        '200':
          description: History updated
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/history/{prompt_id}:
    get:
      operationId: getHistoryByPromptId
      tags:
      - history
      summary: Get history for a specific prompt
      deprecated: true
      description: '**Deprecated.** Superseded by `GET /api/jobs/{job_id}`, which returns

        the same execution record. Planned for removal no earlier than a future

        major release; sunset timeline TBD.

        '
      parameters:
      - $ref: '#/components/parameters/ComfyUserHeader'
      - name: prompt_id
        in: path
        description: The prompt ID to fetch history for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Single-entry history dictionary. Returns an empty object `{}` if the prompt_id is not found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/HistoryEntry'
        '404':
          description: Not Found — use /api/jobs/{prompt_id} instead
  /api/upload/image:
    post:
      operationId: uploadImage
      tags:
      - upload
      summary: Upload an image file
      description: Uploads an image file into one of the input/output/temp directories so it can be referenced by workflow
        nodes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to upload
                type:
                  type: string
                  enum:
                  - input
                  - temp
                  - output
                  default: input
                  description: Target directory type
                overwrite:
                  type: string
                  description: Set to "true" to overwrite existing files
                subfolder:
                  type: string
                  description: Subfolder within the target directory
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
                properties:
                  name:
                    description: Filename of the uploaded image
                    type: string
                  subfolder:
                    description: Subfolder path where image was saved
                    type: string
                  type:
                    description: Type of upload (e.g., "output")
                    type: string
                type: object
        '400':
          description: No file provided or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/upload/mask:
    post:
      operationId: uploadMask
      tags:
      - upload
      deprecated: true
      summary: Upload a mask image (deprecated)
      description: 'Deprecated. Clients should composite the mask onto the source image

        client-side and upload the resulting image via POST /api/upload/image

        instead. This endpoint will continue to function for older clients,

        but will not receive new features.


        Uploads a mask image associated with a previously-uploaded reference image.

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              - original_ref
              properties:
                image:
                  type: string
                  format: binary
                  description: Mask image (alpha channel is used)
                original_ref:
                  type: object
                  description: Reference to the original image file
                  required:
                  - filename
                  properties:
                    filename:
                      type: string
                      description: Filename of the original image
                  additionalProperties: true
                type:
                  type: string
                  enum:
                  - input
                  - temp
                  - output
                  default: input
                  description: Target directory type
                overwrite:
                  type: string
                  description: Set to "true" to overwrite existing files
                subfolder:
                  type: string
                  description: Subfolder within the target directory
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
                properties:
                  name:
                    description: Filename of the uploaded mask
                    type: string
                  subfolder:
                    description: Subfolder path where mask was saved
                    type: string
                  type:
                    description: Type of upload (e.g., "output")
                    type: string
                type: object
        '400':
          description: No file provided or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/view:
    get:
      operationId: viewFile
      tags:
      - view
      summary: View or download a file
      description: Serves a file (image, audio, or video) from the input/output/temp directory identified by the query parameters.
      parameters:
      - name: filename
        in: query
        required: true
        schema:
          type: string
        description: Name of the file to view
      - name: type
        in: query
        schema:
          type: string
          enum:
          - input
          - output
          - temp
          default: output
        description: Directory type
      - name: subfolder
        in: query
        schema:
          type: string
        description: Subfolder within the directory
      - name: preview
        in: query
        schema:
          type: string
        description: Preview format hint (e.g. "webp;90")
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - rgba
          - rgb
          - a
        description: Channel extraction mode
      responses:
        '200':
          description: File content
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                description: Resized JPEG thumbnail (returned when res parameter is used)
                format: binary
                type: string
            image/png:
              schema:
                description: Processed PNG image with extracted channel
                format: binary
                type: string
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '302':
          description: Redirect to GCS signed URL
          headers:
            Location:
              description: Signed URL to access the file in GCS
              schema:
                type: string
            Cache-Control:
              description: Cache directive for the redirect response
              schema:
                type: string
            Vary:
              description: Headers that affect response caching
              schema:
                type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      - CookieAuth: []
  /api/view_metadata/{folder_name}:
    get:
      operationId: viewMetadata
      tags:
      - view
      summary: Get metadata for a file (e.g. safetensors header)
      description: Returns embedded metadata parsed from a file in the given folder — for example, the header of a safetensors
        model.
      parameters:
      - name: folder_name
        in: path
        required: true
        schema:
          type: string
        description: Folder type (output, input, temp, etc.)
      - name: filename
        in: query
        required: true
        schema:
          type: string
        description: Filename to read metadata from
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: File or metadata not found
  /api/system_stats:
    get:
      operationId: getSystemStats
      tags:
      - system
      summary: Get system statistics
      description: Returns hardware, Python, VRAM, and runtime statistics for the running ComfyUI process.
      responses:
        '200':
          description: System stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/features:
    get:
      operationId: getFeatures
      tags:
      - system
      summary: Get enabled feature flags
      description: Returns a dictionary of feature flag names to their enabled state. Cloud deployments may include additional
        typed fields alongside the boolean flags.
      responses:
        '200':
          description: Feature flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                properties:
                  max_upload_size:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Maximum file upload size in bytes.
                  supports_model_type_tags:
                    type: boolean
                    description: Whether the server supports namespaced model-type asset tags.
                  free_tier_credits:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                    x-runtime:
                    - cloud
                    description: '[cloud-only] Credits available to free-tier users. Local ComfyUI returns null.'
                  posthog_api_host:
                    type: string
                    format: uri
                    nullable: true
                    x-runtime:
                    - cloud
                    description: '[cloud-only] PostHog analytics proxy URL for frontend telemetry. Local ComfyUI returns null.'
                  max_concurrent_jobs:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                    x-runtime:
                    - cloud
                    description: '[cloud-only] Maximum concurrent jobs the authenticated user can run. Local ComfyUI returns
                      null.'
                  workflow_templates_version:
                    type: string
                    nullable: true
                    x-runtime:
                    - cloud
                    description: '[cloud-only] Version identifier for the workflow templates bundle. Local ComfyUI returns
                      null.'
                  workflow_templates_source:
                    type: string
                    nullable: true
                    enum:
                    - dynamic_config_override
                    - workflow_templates_version_json
                    x-runtime:
                    - cloud
                    description: '[cloud-only] How the templates version was resolved. Local ComfyUI returns null.'
                  free_tier_balance:
                    description: Free-tier job allowance for an authenticated non-paid (FREE-tier) user in the rollout. Absent
                      for paid users and unauthenticated requests. Synthesized from config before a grant row exists so a
                      brand-new user still sees their full allowance.
                    properties:
                      allowance:
                        description: Total free jobs granted for the current period
                        type: integer
                      remaining:
                        description: Free jobs remaining (allowance - used, floored at 0)
                        type: integer
                      used:
                        description: Free jobs consumed so far
                        type: integer
                    required:
                    - allowance
                    - used
                    - remaining
                    type: object
                  supports_preview_metadata:
                    description: Whether the server supports preview metadata
                    type: boolean
          headers:
            Cache-Control:
              description: Short-lived private cache to deduplicate rapid-fire calls from the frontend
              schema:
                type: string
            Vary:
              description: Cache key includes auth headers so anonymous and authenticated responses are stored separately
              schema:
                type: string
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      - CookieAuth: []
      - {}
  /api/object_info:
