          description: "Category override used by the essentials pack. The\n`essentials_category` key may be present with\
            \ a string value,\npresent and `null`, or absent entirely:\n\n- V1 nodes: `essentials_category` is **omitted**\
            \ when the node\n  class doesn't define an `ESSENTIALS_CATEGORY` attribute, and\n  **`null`** if the attribute\
            \ is explicitly set to `None`.\n- V3 nodes (`comfy_api.latest.io`): `essentials_category` is\n  **always present**,\
            \ and **`null`** for nodes whose `Schema`\n  doesn't populate it.\n"
    ModelFolder:
