          - failed
          description: Current status of the top-up
        amount_cents:
          type: integer
          format: int64
          description: Amount being charged in cents
    CreateWorkspaceAPIKeyResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Response containing the newly created workspace API key.'
      required:
      - id
      - name
      - description
      - key
      - key_prefix
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: API key ID
        name:
          type: string
          description: User-provided label
        description:
          type: string
          description: User-provided description of the key's purpose. Limit is byte-based (UTF-8 encoding); 5000 bytes equals
            5000 ASCII characters or fewer multi-byte characters.
          maxLength: 5000
        key:
          type: string
          description: The full plaintext API key (only shown once)
        key_prefix:
          type: string
          description: First 8 chars after prefix for display
        expires_at:
          type: string
          format: date-time
          description: When the key expires (if set)
        created_at:
          type: string
          format: date-time
          description: When the key was created
    ExchangeTokenResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Response containing the issued Cloud JWT and its expiry.'
      required:
      - token
      - expires_at
      - workspace
      - role
      - permissions
      properties:
        token:
          type: string
          description: Cloud JWT token
        expires_at:
          type: string
          format: date-time
          description: Token expiration time (RFC 3339)
        workspace:
          $ref: '#/components/schemas/WorkspaceSummary'
        role:
          type: string
          enum:
          - owner
          - member
          description: User's role in the workspace
        permissions:
          type: array
          items:
            type: string
          description: Permission strings for the role
          example:
          - owner:*
    JobCancelResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Response for POST /api/jobs/{job_id}/cancel. Returned on both fresh cancels and idempotent
        no-ops.'
      required:
      - cancelled
      properties:
        cancelled:
          type: boolean
          description: 'True when a cancel event was successfully dispatched by this call.

            False when the job was already in a terminal or cancelling state,

            in which case the call is a no-op (still 200 — idempotent).

            '
    ResubscribeResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Response after successfully resubscribing to a billing plan.'
      required:
      - status
      - billing_op_id
      properties:
        billing_op_id:
          type: string
          description: Billing operation ID to poll for status via GET /api/billing/ops/{id}
        status:
          type: string
          enum:
          - active
          description: The subscription status after resubscribing
        message:
          type: string
          description: Human-readable confirmation message
    SubscribeResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Response after successfully subscribing to a billing plan.'
      required:
      - status
      - billing_op_id
      properties:
        billing_op_id:
          type: string
          description: Billing operation ID to poll for status via GET /api/billing/ops/{id}
        status:
          type: string
          enum:
          - subscribed
          - needs_payment_method
          - pending_payment
          description: 'Status of the subscription operation:

            - subscribed: Subscription is active immediately

            - needs_payment_method: User must add payment method via payment_method_url

            - pending_payment: Upgrade initiated, waiting for payment to complete

            '
        effective_at:
          type: string
          format: date-time
          description: When the subscription became/becomes active (present when status=subscribed or pending_payment)
        payment_method_url:
          type: string
          description: URL to redirect user to add payment method (present when status=needs_payment_method)
    UserResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] User information response'
      required:
      - id
      - status
      properties:
        id:
          type: string
          description: Firebase UID of the authenticated user
        status:
          type: string
          description: User status (always "active" for authenticated users)
    WorkflowListResponse:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] Paginated list of saved workflows.'
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    FeedbackRequest:
      type: object
      x-runtime:
      - cloud
      description: '[cloud-only] User feedback submission body.'
      required:
      - message
      properties:
        type:
          type: string
          enum:
          - missing_nodes
          - general
          - missing_models
          description: Feedback category
        category:
          type: string
          description: Additional category metadata
        message:
          type: string
          description: User-provided feedback message
        content:
          description: The feedback content or message
          type: string
        metadata:
          additionalProperties: true
          description: Additional metadata about the feedback
          type: object
        rating:
          description: User's rating of ComfyUI Cloud experience (1-5 stars)
          maximum: 5
          minimum: 1
          type: integer
    InputSpec:
      type: array
      prefixItems:
      - oneOf:
        - type: string
        - type: array
          items:
            oneOf:
            - type: string
            - type: number
            - type: boolean
      - type: object
        properties:
          default:
            type: string
          min:
            type: number
          max:
            type: number
          step:
            type: number
          multiline:
            type: boolean
      items: {}
    Node:
      type: object
      properties:
        input:
          type: object
          required:
          - required
          properties:
            required:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/InputSpec'
            optional:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/InputSpec'
            hidden:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/InputSpec'
        output:
          type: array
          items:
            type: string
        output_is_list:
          description: Indicates if the output of the corresponding index as the item in this array is a list output.
          type: array
          items:
            type: boolean
        output_name:
          type: array
          items:
            type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        category:
          type: string
        output_node:
          type: boolean
    ExtraData:
      type: object
      properties:
        extra_pnginfo:
          type: object
          properties:
            workflow:
              $ref: '#/components/schemas/Workflow'
    Prompt:
      type: object
      description: 'An API-format prompt or a UI-format workflow.


        API format: keys are stringified integers corresponding to nodes, values are PromptNode objects.

        UI format: a LiteGraph workflow object with "nodes" and "links" arrays (exported via Save from the web UI). UI workflows
        are automatically converted to API format.


        You can retrieve the last prompt run using GET /api/v1/prompts

        '
      additionalProperties:
        $ref: '#/components/schemas/PromptNode'
    PromptNode:
      type: object
      required:
      - class_type
      - inputs
      properties:
        _meta:
          type: object
          properties:
            title:
              type: string
              description: 'The title of the node when authored in the workflow. Set only when the end user changed it using
                the

                panel properties in the UI.

                '
        class_type:
          type: string
          description: The node's class type, which maps to a class in NODE_CLASS_MAPPINGS.
        inputs:
          type: object
          additionalProperties:
            anyOf:
            - type: number
            - type: string
            - type: boolean
            - type: 'null'
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: array
              description: 'When this is specified, it is a node connection, followed by an output.

                '
              minItems: 2
              maxItems: 2
              prefixItems:
              - type: string
              - type: integer
              items: {}
          description: The inputs for the node, which can be scalar values or references to other nodes' outputs.
        is_changed:
          oneOf:
          - type: array
            description: An array of hashes representing whether the node has changed (optional).
            items:
              type: string
          - type: string
            description: A string representing whether the node has changed (optional).
    Workflow:
      type: object
      properties:
        last_node_id:
          type: integer
        last_link_id:
          type: integer
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string
              pos:
                type: array
                maxItems: 2
                minItems: 2
                items:
                  type: number
              size:
                type: object
                properties:
                  '0':
                    type: number
                  '1':
                    type: number
              flags:
                type: object
                additionalProperties:
                  type: object
              order:
                type: integer
              mode:
                type: integer
              inputs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    link:
                      type: integer
              outputs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    links:
                      type: array
                      items:
                        type: integer
                    slot_index:
                      type: integer
              properties:
                type: object
              widgets_values:
                type: array
                items:
                  type: string
        links:
          type: array
          items:
            type: array
            items:
              oneOf:
              - type: integer
              - type: string
        groups:
          type: array
          items:
            type: object
        config:
          type: object
        extra:
          type: object
        version:
          type: number
    QueueTuple:
      type: array
      description: 'An item that was added to the queue.

        '
      minItems: 3
      maxItems: 5
      prefixItems:
      - type: number
        description: Queue priority.
      - type: string
        description: The hash id of the prompt object. This should be the the prompt ID.
      - $ref: '#/components/schemas/Prompt'
      - $ref: '#/components/schemas/ExtraData'
      - type: array
        description: A list of "good output" node IDs in the prompt.
        items:
          type: string
      items: {}
    Outputs:
