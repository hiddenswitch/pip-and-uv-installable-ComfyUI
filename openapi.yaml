  /api/tasks:
    get:
      operationId: listTasks
      tags:
      - task
      summary: List background tasks
      description: '[cloud-only] Retrieve a paginated list of background tasks for the authenticated user. Supports filtering
        by task type, status, and creation time.'
      x-runtime:
      - cloud
      parameters:
      - name: task_name
        in: query
        schema:
          type: string
        description: Filter by task type name (exact match).
      - name: idempotency_key
        in: query
        schema:
          type: string
        description: Filter by idempotency key (exact match).
      - name: status
        in: query
        schema:
          type: string
        description: Filter by one or more statuses (comma-separated).
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
        description: Filter tasks created after this timestamp.
      - name: created_before
        in: query
        schema:
          type: string
          format: date-time
        description: Filter tasks created before this timestamp.
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction by create_time.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Pagination offset (0-based).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum items per page (1-100).
      responses:
        '200':
          description: Tasks retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
