  /api/assets/download:
    post:
      operationId: createAssetDownload
      tags:
      - assets
      summary: Download assets to cloud runtime
      description: '[cloud-only] Initiates a download of one or more assets to the cloud runtime environment. Returns a task
        ID for tracking download progress via WebSocket.'
      x-runtime:
      - cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assets
              properties:
                assets:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssetDownloadRequest'
                  description: Assets to download
      responses:
        '202':
          description: Download task accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                - status
                properties:
                  task_id:
                    type: string
                    format: uuid
                    description: ID of the download task; use to poll status.
                  status:
                    type: string
                    enum:
                    - created
                    - running
                    - completed
                    - failed
                    description: Current task status (typically `created` on initial creation).
                  message:
                    type: string
                    description: Human-readable task message.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '200':
          description: File already exists in storage - asset created/returned immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCreated'
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/assets/export:
    post:
      operationId: createAssetExport
      tags:
      - assets
      summary: Export assets as a downloadable archive
      description: '[cloud-only] Initiates a bulk export of assets. Returns a task ID for tracking progress via WebSocket.
        When complete, the export can be downloaded via the exports endpoint.'
      x-runtime:
      - cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_ids:
                  type: array
                  items:
                    type: string
                  description: Job IDs whose associated assets should all be included in the ZIP bundle.
                asset_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Asset IDs to include in the ZIP bundle. Additive to assets associated with provided job IDs.
                export_name:
                  type: string
                  description: Name for the export archive
                naming_strategy:
                  type: string
                  enum:
                  - group_by_job_id
                  - preserve
                  - asset_id
                  - group_by_job_time
                  default: group_by_job_time
                  description: 'Strategy for naming files in the ZIP: group by job ID, preserve original names, use the asset
                    ID, or group by job creation time.'
                job_asset_name_filters:
                  type: object
                  additionalProperties:
                    type: array
                    minItems: 1
                    items:
                      type: string
                  description: Optional per-job asset name filters. When provided for a job ID, only assets whose name matches
                    one of the listed names are included.
      responses:
        '202':
          description: Export task accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                - status
                properties:
                  task_id:
                    type: string
                    format: uuid
                    description: ID of the export task; use to poll status.
                  status:
                    type: string
                    enum:
                    - created
                    - running
                    - completed
                    - failed
                    description: Current task status (typically `created` on initial creation).
                  message:
                    type: string
                    description: Human-readable task message.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
