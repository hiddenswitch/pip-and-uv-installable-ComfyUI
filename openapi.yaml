          description: File name or path relative to the user directory
        created:
          type: number
          description: Unix timestamp of file creation
        size:
          type: integer
          description: File size in bytes
        modified:
          type: integer
          format: int64
          description: Unix timestamp of last modification in milliseconds
    Asset:
      type: object
      description: A registered asset — an input/output file tracked in the asset database with content hash and metadata.
      required:
      - id
      - name
      - size
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the asset
        name:
          type: string
          description: Name of the asset file
        loader_path:
          type: string
          nullable: true
          description: The value a loader consumes to load this asset. Null when no loader can resolve the file.
        display_name:
          type: string
          nullable: true
          description: Human-facing label for the asset. Not unique.
        hash:
          type: string
          nullable: true
          description: Blake3 content hash of the asset (preferred over asset_hash)
          pattern: ^blake3:[a-f0-9]{64}$
        asset_hash:
          type: string
          nullable: true
          deprecated: true
          description: 'Deprecated: use `hash` instead. Blake3 hash of the asset content.'
          pattern: ^blake3:[a-f0-9]{64}$
        size:
          type: integer
          format: int64
          description: Size of the asset in bytes
        mime_type:
          type: string
          description: MIME type of the asset
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the asset
        user_metadata:
          type: object
          description: Custom user metadata
          additionalProperties: true
        metadata:
          type: object
          description: System-managed metadata (read-only)
          additionalProperties: true
          readOnly: true
        preview_url:
          type: string
          format: uri
          description: URL for asset preview/thumbnail
        preview_id:
          type: string
          format: uuid
          description: ID of the preview asset if available
          nullable: true
        prompt_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: 'Deprecated: use job_id instead. ID of the prompt that created this asset.'
        job_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the job that created this asset
        created_at:
          type: string
          format: date-time
          description: Timestamp when the asset was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the asset was last updated
        last_access_time:
          type: string
          format: date-time
          description: Timestamp when the asset was last accessed
        is_immutable:
          type: boolean
          description: Whether this asset is immutable
        file_path:
          description: Relative path in global-namespace-root form (e.g. "models/checkpoints/flux.safetensors")
          nullable: true
          type: string
        short_url:
          description: Durable, owner-gated short link to this asset's content (relative `/api/s/{id}` path). Stable across
            the underlying signed URL's expiry — resolving it re-mints a fresh signed URL on every request — so it is safe
            to persist or share into chat, unlike `preview_url`. Only the minting user can resolve it. Omitted when the short-link
            surface is disabled or the asset has no resolvable content hash.
          nullable: true
          type: string
          x-runtime:
          - cloud
    AssetCreated:
