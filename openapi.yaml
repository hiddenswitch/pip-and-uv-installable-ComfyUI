      summary: Upload a new asset
      description: Uploads a new asset (binary content plus metadata) and registers it in the asset database.
      x-feature-gate: enable-assets
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Asset file to upload
                name:
                  type: string
                  description: Display name for the asset
                tags:
                  type: string
                  description: Include exactly one destination role (input, output, or models); models uploads also require
                    one model_type:<folder_name> tag.
                user_metadata:
                  type: string
                  description: JSON-encoded user metadata
                hash:
                  type: string
                  description: Blake3 hash of the file content (e.g. blake3:abc123...)
                  pattern: ^(blake3|sha256):[a-f0-9]{64}$
                mime_type:
                  type: string
                  description: MIME type of the file (overrides auto-detected type)
                preview_id:
                  type: string
                  format: uuid
                  description: ID of an existing asset to use as the preview image
                id:
                  type: string
                  format: uuid
                  nullable: true
                  x-runtime:
                  - cloud
                  description: '[cloud-only] Client-supplied asset ID for idempotent creation. If an asset with this ID already
                    exists, the existing asset is returned.'
          application/json:
            schema:
              type: object
              x-runtime:
              - cloud
              description: '[cloud-only] URL-based asset upload. Caller supplies a URL instead of a file body; the server
                fetches the content.'
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                  description: '[cloud-only] URL of the file to import as an asset'
                name:
                  type: string
                  description: Display name for the asset
                tags:
                  type: string
                  description: Comma-separated tags
                user_metadata:
                  type: string
                  description: JSON-encoded user metadata
                hash:
                  type: string
                  description: Blake3 hash of the file content (e.g. blake3:abc123...)
                mime_type:
                  type: string
                  description: MIME type of the file (overrides auto-detected type)
                preview_id:
