            comfyui_version:
              type: string
            pytorch_version:
              type: string
            required_frontend_version:
              type: string
            comfyui_frontend_version:
              type: string
            workflow_templates_version:
              type: string
            installed_templates_version:
              type: string
            required_templates_version:
              type: string
            cloud_version:
              type: string
            argv:
